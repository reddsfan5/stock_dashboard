# 阅读板块共享术语表：正文写 [[术语]] 或 [[显示文字|术语]] 显式标注；
# 文章配置 glossary_auto: true 时，每个术语（含 aliases）在全文首次出现处自动加释义气泡。
# 桌面端悬停、手机端点按显示。释义为通俗解释，不代表原作者原话。
terms:
  情绪周期:
    def: 市场整体情绪在"赚钱效应 → 亏钱效应 → 赚钱效应"之间循环的过程。养家认为这是股市唯一可预期的规律。
  赚钱效应:
    def: 近期参与短线的人普遍赚钱，带动更多场外资金进场、追涨意愿增强的状态。
  亏钱效应:
    def: 近期参与者普遍亏钱，导致资金离场、卖出意愿增强、买入意愿减弱的状态。
  群体博弈:
    def: 把股价看成场内持筹者与场外持币者之间力量与心理的较量，而不是单只股票本身的"价值"或"形态"。
  龙头:
    def: 某一题材或板块里涨得最早、最强、最受资金关注的个股，对板块其他个股有带动作用。
    aliases: [龙头股]
  跟风:
    def: 跟随龙头上涨的同板块个股，通常涨幅和持续性弱于龙头。
  打板:
    def: 在个股涨停价（"板"）上买入，赌次日或后续继续上涨。
    aliases: [板上买票]
  涨停:
    def: A 股单日涨幅达到上限（主板通常 10%），以涨停价封住称"封板"。
  满仓:
    def: 账户资金几乎全部买入股票，没有留现金。
  重仓:
    def: 单笔或单只股票占账户资金比例很高的持仓。
  超跌:
    def: 短期跌幅明显过大、偏离正常水平的个股或板块，常伴随恐慌性抛售。
    aliases: [超跌股]
  低吸:
    def: 在价格回落、相对低位时买入，与"追涨"相对。
  追涨:
    def: 在价格上涨过程中、甚至创新高时买入，押注强者恒强。
  热点:
    def: 一段时间内被市场集中炒作、资金和关注度最高的题材或板块。
    aliases: [主流热点]
  题材:
    def: 能让市场产生联想和炒作预期的故事，如政策、新技术、事件等。
  大局观:
    def: 跳出单只股票，从政策、资金、人气、板块等整体环境判断当前该进攻还是防守。
  胜率:
    def: 同类交易中盈利次数占总次数的比例。
  涨跌空间比:
    def: 预期上涨空间与可能下跌空间之比，类似"盈亏比"。养家满仓要求上涨 30%–50% 以上、下跌 3%–5% 以内。
  赢面:
    def: 养家的说法：胜率 + 涨跌空间比，两者综合决定一笔交易值不值得做、下多重。
  止损:
    def: 亏损到某个幅度就卖出以限制损失。养家反对以买入成本为参照的止损，只按对未来的判断买卖。
  止盈:
    def: 盈利到某个幅度就卖出锁定利润。
  补仓:
    def: 持仓下跌后再买入以摊低成本。
  反抽:
    def: 下跌趋势中的短暂反弹。
  大阴线:
    def: 当日大幅下跌的 K 线（收盘远低于开盘）。
  5 日线:
    def: 最近 5 个交易日收盘价的均线，常用来衡量短期走势是否偏离过大。
  左侧交易:
    def: 在趋势反转确认之前（价格仍在下跌时）提前买入；与之相对的是确认后才买的右侧交易。
  做 T:
    def: 同一天对同一只股票先买后卖或先卖后买，赚取日内差价（A 股 T+1 下需有底仓）。
  冲击成本:
    def: 资金量大时，自己的买卖会推动价格，导致实际成交价比预想差。
  分仓:
    def: 把资金分散到多只股票，降低单一标的的冲击成本和风险。
  次新股:
    def: 上市时间不长（通常一年内）的股票，流通盘小、弹性大。
  股指期货:
    def: 以股票指数为标的的期货合约，可做多做空、带杠杆。
  游资:
    def: 以短线炒作为主、资金在热点之间快速流动的个人大户或机构席位。
  淘股吧:
    def: 国内知名短线交易者论坛，炒股养家、Asking、职业炒手等人的语录多由这里的帖子流传。
  空仓:
    def: 账户里不持有任何股票，只有现金。
  共振:
    def: 政策、资金、技术、信息、人气等多方面同时向好，形成合力。
  守株待兔:
    def: Asking 的低吸说法：对已有两个以上大阳线涨停的强势股，等它回落到均线附近再买，等反弹赚钱；弱市里容易被破位。
  半仓:
    def: 只动用一半资金。Asking 的规则是先半仓试错，只有这半仓迅速盈利才动用另一半。
  全仓:
    def: 把可用资金全部投入（与"满仓"同义）。
  超强势股:
    def: 短期涨幅、连板高度远超同类的个股。Asking 认为它不一定是真龙头——龙头还要求出现在大盘转势初期并带动板块。
  人气股:
    def: 市场关注度、讨论度和成交最集中的个股，往往是热点中的焦点。
  杂毛:
    def: 短线圈俗语，指板块里跟风、没有辨识度的小票，与龙头相对。
  板块效应:
    def: 同一题材的多只个股同时走强、互相带动，形成合力；单兵突进的个股则缺乏板块效应。
  首板:
    def: 个股本轮上涨的第一个涨停板。打首板即在第一个涨停时买入。
  龙虎榜:
    def: 交易所每日公布的异动个股成交前五买卖席位名单，短线资金常据此观察游资动向。
  席位:
    def: 券商营业部的交易席位，龙虎榜上显示的是营业部名称，常被用来推测是哪路游资。
  盘感:
    def: 长期看盘形成的、对市场节奏和强弱的直觉判断，需要持续参与才能保持。
  复利:
    def: 收益滚入本金继续增值。对短线而言，最怕大回撤打断复利曲线。
  回撤:
    def: 账户净值从最高点回落的幅度。职业炒手把"资金回撤不超过最高点的 5%"当作核心风控线。
    aliases: [资金回撤]
  主线:
    def: 一段行情里持续性最强、资金反复炒作的核心板块或题材。
  换手:
    def: 换手率，一段时间内成交股数占流通股的比例，反映筹码交换是否充分。
    aliases: [换手率]
  闽发论坛:
    def: 2000 年代初活跃的证券论坛（闽发证券旗下），Asking、职业炒手等早期超短高手曾在此发帖，后来不少人转到淘股吧。
    aliases: [闽发]
  实盘赛:
    def: 论坛组织的用真实账户公开晒交易的比赛，用来检验并展示操作水平。
  阳光私募:
    def: 通过信托等合规渠道发行、定期公开披露净值的私募证券基金。
  成都帮:
    def: 以成都为根据地的一批知名短线游资的统称，职业炒手被视为其代表人物之一。
  一级市场:
    def: 企业上市前的股权融资市场（天使轮、A 轮等），与买卖已上市股票的二级市场相对。
  超短:
    def: 持股时间极短（通常一两天）的短线交易，买了就要马上赚钱，不参与调整。
    aliases: [超短线]
  均线:
    def: 一段时间内收盘价的平均值连成的线，如 5 日线、10 日线，用来观察趋势与支撑。
  成交量:
    def: 一段时间内成交的股数或金额。Asking 说"操短对行情好坏只有一个标准——量"。
    aliases: [量能]
  大阳线:
    def: 当日大幅上涨、收盘远高于开盘的 K 线。
  空仓待时:
    def: 职业炒手的说法：没有把握的时候拿着现金等待，直到强势市场和主流热点出现。
