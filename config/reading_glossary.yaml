# 阅读板块共享术语表：正文写 [[术语]] 或 [[显示文字|术语]] 显式标注；
# 文章配置 glossary_auto: true 时，每个术语（含 aliases）在全文首次出现处自动加释义气泡。
# 桌面端悬停、手机端点按显示。释义为通俗解释，不代表原作者原话。
terms:
  情绪周期:
    def: 市场整体情绪在"赚钱效应 → 亏钱效应 → 赚钱效应"之间循环的过程。养家认为这是股市唯一可预期的规律。
  赚钱效应:
    def: 近期参与短线的人普遍赚钱，带动更多场外资金进场、追涨意愿增强的状态。
  亏钱效应:
    def: 近期参与者普遍亏钱，导致资金离场、卖出意愿增强、买入意愿减弱的状态。
  群体博弈:
    def: 把股价看成场内持筹者与场外持币者之间力量与心理的较量，而不是单只股票本身的"价值"或"形态"。
  龙头:
    def: 某一题材或板块里涨得最早、最强、最受资金关注的个股，对板块其他个股有带动作用。
    aliases: [龙头股]
  跟风:
    def: 跟随龙头上涨的同板块个股，通常涨幅和持续性弱于龙头。
  打板:
    def: 在个股涨停价（"板"）上买入，赌次日或后续继续上涨。
    aliases: [板上买票]
  涨停:
    def: A 股单日涨幅达到上限（主板通常 10%），以涨停价封住称"封板"。
  满仓:
    def: 账户资金几乎全部买入股票，没有留现金。
  重仓:
    def: 单笔或单只股票占账户资金比例很高的持仓。
  超跌:
    def: 短期跌幅明显过大、偏离正常水平的个股或板块，常伴随恐慌性抛售。
    aliases: [超跌股]
  低吸:
    def: 在价格回落、相对低位时买入，与"追涨"相对。
  追涨:
    def: 在价格上涨过程中、甚至创新高时买入，押注强者恒强。
  热点:
    def: 一段时间内被市场集中炒作、资金和关注度最高的题材或板块。
    aliases: [主流热点]
  题材:
    def: 能让市场产生联想和炒作预期的故事，如政策、新技术、事件等。
  大局观:
    def: 跳出单只股票，从政策、资金、人气、板块等整体环境判断当前该进攻还是防守。
  胜率:
    def: 同类交易中盈利次数占总次数的比例。
  涨跌空间比:
    def: 预期上涨空间与可能下跌空间之比，类似"盈亏比"。养家满仓要求上涨 30%–50% 以上、下跌 3%–5% 以内。
  赢面:
    def: 养家的说法：胜率 + 涨跌空间比，两者综合决定一笔交易值不值得做、下多重。
  止损:
    def: 亏损到某个幅度就卖出以限制损失。养家反对以买入成本为参照的止损，只按对未来的判断买卖。
  止盈:
    def: 盈利到某个幅度就卖出锁定利润。
  补仓:
    def: 持仓下跌后再买入以摊低成本。
  反抽:
    def: 下跌趋势中的短暂反弹。
  大阴线:
    def: 当日大幅下跌的 K 线（收盘远低于开盘）。
  5 日线:
    def: 最近 5 个交易日收盘价的均线，常用来衡量短期走势是否偏离过大。
  左侧交易:
    def: 在趋势反转确认之前（价格仍在下跌时）提前买入；与之相对的是确认后才买的右侧交易。
  做 T:
    def: 同一天对同一只股票先买后卖或先卖后买，赚取日内差价（A 股 T+1 下需有底仓）。
    aliases: [做T]
  冲击成本:
    def: 资金量大时，自己的买卖会推动价格，导致实际成交价比预想差。
  分仓:
    def: 把资金分散到多只股票，降低单一标的的冲击成本和风险。
  次新股:
    def: 上市时间不长（通常一年内）的股票，流通盘小、弹性大。
  股指期货:
    def: 以股票指数为标的的期货合约，可做多做空、带杠杆。
    aliases: [期指]
  游资:
    def: 以短线炒作为主、资金在热点之间快速流动的个人大户或机构席位。
  淘股吧:
    def: 国内知名短线交易者论坛，炒股养家、Asking、职业炒手等人的语录多由这里的帖子流传。
  空仓:
    def: 账户里不持有任何股票，只有现金。
  共振:
    def: 政策、资金、技术、信息、人气等多方面同时向好，形成合力。
  守株待兔:
    def: Asking 的低吸说法：对已有两个以上大阳线涨停的强势股，等它回落到均线附近再买，等反弹赚钱；弱市里容易被破位。
  半仓:
    def: 只动用一半资金。Asking 的规则是先半仓试错，只有这半仓迅速盈利才动用另一半。
  全仓:
    def: 把可用资金全部投入（与"满仓"同义）。
  超强势股:
    def: 短期涨幅、连板高度远超同类的个股。Asking 认为它不一定是真龙头——龙头还要求出现在大盘转势初期并带动板块。
  人气股:
    def: 市场关注度、讨论度和成交最集中的个股，往往是热点中的焦点。
  杂毛:
    def: 短线圈俗语，指板块里跟风、没有辨识度的小票，与龙头相对。
  板块效应:
    def: 同一题材的多只个股同时走强、互相带动，形成合力；单兵突进的个股则缺乏板块效应。
  首板:
    def: 个股本轮上涨的第一个涨停板。打首板即在第一个涨停时买入。
  龙虎榜:
    def: 交易所每日公布的异动个股成交前五买卖席位名单，短线资金常据此观察游资动向。
  席位:
    def: 券商营业部的交易席位，龙虎榜上显示的是营业部名称，常被用来推测是哪路游资。
  盘感:
    def: 长期看盘形成的、对市场节奏和强弱的直觉判断，需要持续参与才能保持。
  复利:
    def: 收益滚入本金继续增值。对短线而言，最怕大回撤打断复利曲线。
  回撤:
    def: 账户净值从最高点回落的幅度。职业炒手把"资金回撤不超过最高点的 5%"当作核心风控线。
    aliases: [资金回撤]
  主线:
    def: 一段行情里持续性最强、资金反复炒作的核心板块或题材。
  换手:
    def: 换手率，一段时间内成交股数占流通股的比例，反映筹码交换是否充分。
    aliases: [换手率]
  闽发论坛:
    def: 2000 年代初活跃的证券论坛（闽发证券旗下），Asking、职业炒手等早期超短高手曾在此发帖，后来不少人转到淘股吧。
    aliases: [闽发]
  实盘赛:
    def: 论坛组织的用真实账户公开晒交易的比赛，用来检验并展示操作水平。
  阳光私募:
    def: 通过信托等合规渠道发行、定期公开披露净值的私募证券基金。
  成都帮:
    def: 以成都为根据地的一批知名短线游资的统称，职业炒手被视为其代表人物之一。
  一级市场:
    def: 企业上市前的股权融资市场（天使轮、A 轮等），与买卖已上市股票的二级市场相对。
  超短:
    def: 持股时间极短（通常一两天）的短线交易，买了就要马上赚钱，不参与调整。
    aliases: [超短线]
  均线:
    def: 一段时间内收盘价的平均值连成的线，如 5 日线、10 日线，用来观察趋势与支撑。
  成交量:
    def: 一段时间内成交的股数或金额。Asking 说"操短对行情好坏只有一个标准——量"。
    aliases: [量能]
  大阳线:
    def: 当日大幅上涨、收盘远高于开盘的 K 线。
  空仓待时:
    def: 职业炒手的说法：没有把握的时候拿着现金等待，直到强势市场和主流热点出现。
  一字板:
    def: 开盘即涨停、全天封死不打开，K 线呈"一"字。普通投资者通常很难买进。
  锁仓:
    def: 买入后不卖、继续持有几天，不做日内或隔日的进出。
  试错:
    def: 用小仓位先买一点，借市场的反馈验证判断；对了再加仓，错了小亏离场。养家把试错单比作拳击里试探对手的"刺拳"。
    aliases: [试错单]
  交割单:
    def: 券商出具的成交明细，实盘赛选手常公开交割单供人检验与学习。
  集合竞价:
    def: 开盘前（9:15–9:25）集中撮合形成开盘价的交易阶段。
  恐慌效应:
    def: 养家早期用语，指亏钱带来恐慌、资金离场的状态，与"赚钱效应"相对；后来多说"亏钱效应"。
  主升浪:
    def: 一只股票或一个板块上涨过程中最猛烈、持续时间最长的那一段。强势市场里拿住龙头的主升浪，是钙片一派的核心打法。
  股性:
    def: 一只股票的"性格"：是否活跃、是否常有人炒、历史上是否涨得流畅、一异动是否有大量跟风盘。股性活跃的股票更容易形成合力。
  涨停排队:
    def: 在涨停价挂单排队买入，等待封单被打开或有卖单成交。难度和风险都很高：封不住时买到的往往是开板的筹码。
    aliases: [排板]
  权证:
    def: 一种以股票为标的的衍生品，2005–2011 年前后在 A 股交易，T+0、无涨跌幅限制，投机性极强，现已基本退出。
  分时图:
    def: 以分钟为单位画出的当日价格与成交量走势图，短线选手用它观察盘中力量是否流畅、有序。
    aliases: [分时]
  护城河:
    def: 巴菲特的比喻：企业周围保护高回报、让竞争者难以攻入的持久优势，例如低成本、品牌或网络效应。他强调"持久"，需要不断重建的护城河终将不是护城河。
  安全边际:
    def: 买入价明显低于估算的内在价值，留出的缓冲空间用来应对估算错误和坏运气。格雷厄姆和巴菲特称之为投资的"基石"。
  内在价值:
    def: 一家企业在剩余寿命中能产生的现金，按适当利率折现后的价值。它只能估计，不同的人、不同的时点估算结果都会不同。
  市场先生:
    def: 格雷厄姆的寓言：每天来向你报价的情绪化合伙人，时而狂喜、时而沮丧。他是来为你服务的，不是来指导你的。
  能力圈:
    def: 自己真正能理解、能评估的企业和行业范围。巴菲特认为圈子大小不重要，知道边界才重要。
  浮存金:
    def: 保险公司先收保费、后支付赔款，这期间可以用来投资的资金。它是伯克希尔扩张的重要资金来源。
    aliases: [浮存]
  烟蒂股:
    def: 巴菲特早期的方法：买入极其便宜但生意平庸的公司，就像捡起还能吸一口的烟蒂。他后来认为这种方法规模有限，转向"合理价格买好公司"。
    aliases: [烟蒂, 烟蒂法]
  指数基金:
    def: 被动跟踪某个股票指数、费用低廉的基金。巴菲特多次建议不懂具体企业的普通投资者定期买入。
  资本配置:
    def: 决定企业赚来的钱怎么用：再投资、收购、回购、分红还是持有现金。巴菲特认为这是 CEO 最重要的工作之一。
  贝塔:
    def: 衡量股价相对大盘波动程度的指标（β）。学术界常拿它代表风险，巴菲特认为把波动当风险是错误的。
    aliases: [beta]
  定增:
    def: 定向增发，上市公司向特定投资者非公开发行新股，通常有锁定期。大资金常以此参与。
    aliases: [定向增发]
  十大流通股东:
    def: 上市公司定期报告中披露的、持有流通股最多的前十名股东。媒体常据此追踪知名个人投资者的持仓，但披露有滞后。
  一致行动人:
    def: 通过协议或其他安排共同扩大对上市公司股份表决权的投资者。持股合并计算，需要合并履行信息披露义务。
  二板:
    def: 连续第二个涨停板。不少短线选手认为二板比首板更能确认资金合力，“一进二”指在二板上买入。
  连板:
    def: 连续多个交易日涨停，如三连板、五连板。连板越高，关注度越大，分歧和风险也越大。
  反包:
    def: 强势股大跌或收阴之后，次日或随后再度大涨甚至涨停，把前一天的跌幅“包”回去。
  回封:
    def: 涨停被砸开（开板）后又重新封住涨停。有人认为回封更能看出资金意图，但炸板不回的风险很大。
    aliases: [回封板]
  炸板:
    def: 盘中封住涨停后又被大单卖开、且收盘没能回封。打板者当天就可能面临较大浮亏。
  烂板:
    def: 涨停封得不牢、反复开板的板，常伴随巨量换手。次日走势分化大。
  隔日交易:
    def: 今天买入、下一个交易日卖出（A 股 T+1 下最短的持股周期）的超短线做法，持股一般 1–2 天。
  分时点火:
    def: 盘中某一时刻用较大资金快速拉升股价、吸引跟风，带动个股走强的手法。
    aliases: [点火]
  卡位:
    def: 在原有龙头走弱或分歧时，新的个股以更强的走势抢走龙头地位。
  妖股:
    def: 脱离基本面、走势远超同板块的极端强势股，常连续涨停，波动和风险都极大。
  配资:
    def: 用自有资金作保证金，从配资方借入数倍资金炒股。场外配资不受券商两融监管，爆仓风险极高。
  特停:
    def: 交易所对异常波动的股票实施盘中临时停牌或停牌核查，持有者在停牌期间无法卖出。
  普世智慧:
    def: 芒格的说法（worldly wisdom）：把多个学科的基本模型组成“格栅”，用来理解世界和做决策，而不是只靠单一学科或孤立事实。
  思维模型:
    def: 来自数学、心理学、经济学、工程等学科的基本原理，如复利、激励、规模优势、临界点。芒格认为八九十个模型就能解决大部分问题。
    aliases: [模型格栅]
  反过来想:
    def: 逆向思考：不先问“怎样成功”，而问“怎样必然失败”，再设法避开。芒格常引用数学家雅可比的“Invert, always invert”。
    aliases: [逆向思维]
  Lollapalooza效应:
    def: 芒格的用语：几种心理倾向朝同一方向叠加时，结果会走向极端，例如公开叫价拍卖中的非理性出价。
    aliases: [Lollapalooza]
  社会认同:
    def: 心理倾向：看到周围人怎样想、怎样做，就自动跟着想、跟着做。在股市里表现为“别人都在买所以我也买”。
  激励偏差:
    def: 人会被报酬方式左右判断和行为。芒格把激励列为误判心理学的第一条：先问“这件事让谁得利、他怎样拿报酬”。
  不为清单:
    def: 段永平常说的 stop doing list：把确定不对的事情列出来坚决不做，例如“不懂不碰、不用 margin”。条目宜少不宜多。
    aliases: [stop doing list]
  本分:
    def: 步步高体系的核心价值观。段永平的解释是“做对的事情+把事情做对”，明知错的事情还去做就是不本分；本分用来约束自己。
  平常心:
    def: 段永平的解释：排除外界干扰、回到事物本源的心态，尤其在有诱惑的时候；他也说“平常心就是理性”。
  商业模式:
    def: 一门生意靠什么赚钱、能否长期赚钱、别人能否轻易复制。段永平把它和企业文化并列为看公司的两道过滤器。
    aliases: [生意模式]
  毛估估:
    def: 段永平的口头语：估值只需大致估算，“如果要用到计算器才能算出来的便宜就不够便宜了”。
  机会成本:
    def: 把钱投在这里而放弃的其他选择中最好的那个回报。段永平说投什么“其实是基于机会成本的”。
  关键价位:
    def: 利弗莫尔所说的“关键点”（Pivotal Point）：价格越过或跌破它并走出确认幅度，往往意味着新一段行情开始。
    aliases: [关键点]
  正常回调:
    def: 利弗莫尔的说法：上升趋势中成交量缩小的小幅回落，之后会继续上涨。与之相对的是一天内大幅回落的“异常”走势。
  危险信号:
    def: 利弗莫尔的说法：趋势中突然出现的异常走势（如一天内从高点回落六个点以上），出现时应先离场，不与市场争辩。
  投机商号:
    def: 又译“对赌行”（bucket shop）：20 世纪初美国不真实成交、只按行情与客户对赌的营业部。利弗莫尔少年时在这里出名。
    aliases: [对赌行, bucket shop]
  金字塔加仓:
    def: 只在已有仓位盈利时分批加仓，每一笔都比上一笔价格更有利；亏损时不加仓。利弗莫尔的做法是先买五分之一，涨了再买。
  杠杆:
    def: 借钱放大仓位，如融资融券、配资、期货保证金。收益和亏损同时放大，大跌时可能被强制平仓。
  复盘:
    def: 收盘后回看当天的市场、板块、个股和自己的交易，找出原因并为下一个交易日做计划。
  L2行情:
    def: 交易所提供的高级行情（Level-2），比普通行情多出逐笔成交、逐笔委托、十档买卖盘等，刷新也更快，需要付费。
    aliases: [L2, Level-2]
  T+1:
    def: A 股的交收规则：当天买入的股票最早下一个交易日才能卖出，所以买入当天走坏也无法止损。
  逆回购:
    def: 这里指国债逆回购：把闲置资金短期借出、按约定利率收息，到期自动回到账户，相当于有利息的空仓。
    aliases: [国债逆回购]
  半路板:
    def: 在股价快速拉升、尚未封住涨停的途中买入，赌它会继续冲上涨停。比打板早，也更容易冲高回落。
  YY:
    def: 瑞鹤仙的用语：一厢情愿地预期某只股票会连续涨停、主力会来炒它。他说“YY容易受伤”。
  套期保值:
    def: 持有现货的同时在期货上做反向仓位，用一边的盈利抵消另一边的亏损，以降低价格波动风险。
    aliases: [套保]
  贴水:
    def: 期货价格低于对应现货（指数）价格，差额叫贴水，常被看作市场偏悲观的信号；反之叫升水。
  持仓量:
    def: 期货市场上尚未平仓的合约总数。成交量反映交易活跃度，持仓量反映多空双方仍在场内的资金规模。
  封单:
    def: 股票封住涨停（或跌停）后，挂在涨停价（或跌停价）上排队买入（或卖出）的委托量。封单越大，通常封得越牢。
  筹码:
    def: 市场上流通的股票，以及它们在不同持有人手里的分布。“筹码松动”指持股的人开始大量卖出。
  估值修复:
    def: 长期被低估的股票随着预期改善被重新定价、估值回升的过程。瑞鹤仙认为其本质是“盈利能力改善的预期”修复。
  卖出风险:
    def: 炒股养家的口诀“买入机会，卖出风险”：走势不如预期时，卖掉的不是股票而是风险，不必纠结卖在最高点。
