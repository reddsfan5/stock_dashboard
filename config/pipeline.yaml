# ============================================================
# 选股管线配置文件
# 修改参数后运行: python stock_pipeline.py
# ============================================================

continuity:
  # K线连续性选股 —— 每天均线接续不中断
  # 条件：今日最高 > 昨日最低 + 昨日收盘 × min_gap_pct%
  min_gap_pct: 3         # 最小接续区%，越大越严格（默认1.5）
  strict:     true       # true=K线必须重叠不允许跳空，false=允许跳空上涨
  min_amount:  5000      # 日均成交额下限（万元）
  lookback:    12         # 回看天数

sideways:
  # 横盘震荡选股 —— 趋势平坦、K线重叠、振幅小
  days:        10         # 回看天数
  max_amp:     15         # 最大振幅%（越小越严格）
  min_amount:  5000       # 日均成交额下限（万元）
  max_slope:   0.5        # 趋势斜率上限（%/天，越小越平）
  min_overlap: 30         # 最小平均重叠率%
  r2_max:      0.3        # 线性R²上限（越小趋势越不明显，0=不过滤）

trend-up:
  # 连续上涨 —— 稳步爬升，过滤涨停连板
  days:      5            # 连续天数
  max_gain:  35           # 累计涨幅上限%（过滤连板妖股）
  min_amount: 5000        # 日均成交额下限（万元）

trend-down:
  # 连续下跌 —— 寻找超跌反弹机会
  days:      5            # 连续天数
  max_gain:  30           # 累计跌幅上限%（绝对值）
  min_amount: 5000        # 日均成交额下限（万元）

upward_gap:
  # 持续推高 —— 连续N天最高价 > 前收×(1+min_gap_pct%)
  days: 5                  # 连续天数
  min_gap_pct: 1.5         # 每日最低溢价幅度%
  min_amount: 5000         # 日均成交额下限（万元）
  max_consecutive_gain: 20  # N天总涨幅上限%（过滤妖股）

long_shadow:
  # 长下影线频现 —— 近N日半数以上收长下影线
  days: 10                # 回看天数
  min_ratio: 0.4          # 下影线/总振幅 最低比例
  min_count: 5            # 至少满足天数
  min_amount: 5000        # 日均成交额下限（万元）

hammer:
  # 金针探底 —— 近N日出现长下影线探底形态
  min_shadow_ratio: 3     # 下影线/实体最小倍数（越大越严格）
  max_bottom_pos:  20     # 金针最低价必须处于近期区间底部N%以内
  hammer_days:    3       # 近N天内出现即可
  min_amount:     5000    # 日均成交额下限（万元）
