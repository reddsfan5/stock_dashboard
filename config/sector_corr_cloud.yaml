# 板块相关点云（scripts/reports/gen_sector_corr_cloud.py）参数
# 缺省值见 scripts/reports/sector_lead_stats.py::DEFAULTS；此处覆盖即可。
start: "2022-01-01"          # 关系样本起点（beta 预热会自动向前多取一个窗口）

benchmark:
  code: sh000300             # 去 beta 基准：沪深300（data/index.py 缓存）
  name: 沪深300
  fallback_codes: [sh000001] # 沪深300 不可用时依次尝试；全失败才退回板块等权并在页脚告警
  min_coverage: 0.95         # 基准需覆盖关系样本交易日的比例

beta:
  window: 120                # 滚动 beta 窗口（交易日），只用 t-1 及以前数据
  min_periods: 60

sync:
  corr_thr: 0.42
  max_edges_per_node: 8
  min_year_confirm: 2

lead:
  max_lag: 4                 # 周
  xcorr_thr: 0.08            # 候选预筛（不代表显著）
  asym: 0.015                # 领先方向需强于反向
  max_out: 4                 # 每个领先板块最多保留几条出边
  event_q: 0.80              # 事件分位：≥80% 为强、≤20% 为弱
  min_events: 15             # 强/弱事件各至少多少周
  min_lift: 0.02             # 顺向命中相对基准至少提升 2pt
  min_weeks: 40              # 交叉相关最少有效周数
  fdr_alpha: 0.10            # BH-FDR 水平（全部有序板块对）
  null_min_shift: 8          # 循环平移最少偏移周数，避免同步相关泄漏进零分布

oos:
  min_train_weeks: 104       # 首个训练段长度（周）
  test_weeks: 26             # 每个测试段长度（周）
  step_weeks: 26             # 滚动步长（周）
  min_events: 6              # 单边样本外事件数下限（用于 oos_ok 标记）

display:
  per_core_direction: 3      # 聚焦时每个方向最多显示几条领先边
  focus_total: 12            # 聚焦时最多显示的领先边总数
  show_failed_default: false # 未通过 FDR 的边默认隐藏（打开开关后以虚线显示）
  default_mode: sync         # 默认连线模式；领先传导为实验功能（当前无边通过 FDR）
  auto_rotate: true          # 初始自转；任何用户操作或聚焦后停止
  auto_rotate_speed: 0.55
  top_movers_labels: 8       # 全局视图标注涨跌幅前 N 的板块（一半涨、一半跌）
  label_limit: 18            # 聚焦时最多标注的邻居数（另做屏幕空间去重叠）
  color_clip_pct: 0.90       # 颜色/大小按 |涨跌| 的该分位封顶，抗离群值
  min_ret_scale: 0.5         # 封顶值下限（%）
  pick_radius_px: 14         # 鼠标点选半径（屏幕像素）
  pick_radius_touch_px: 28   # 触屏点选半径（屏幕像素）
  mobile_panel_vh: 42        # 手机底部面板最大高度（vh）；聚焦时相机按面板高度上移
  legend_open_mobile: false  # 手机端图例默认折叠
  color_by: community        # 节点默认着色：community（同步图社区）| return（涨跌）
  rotate_resume_ms: 1500     # 拖动/捏合松手后多久恢复自转（毫秒）
  focus_orbit_speed: 0.3     # 聚焦时绕焦点慢速环绕的速度（auto_rotate_speed 同单位）
  auto_rotate_reduced_motion: false  # 系统开启“减少动态效果”时是否仍自转
  web_opacity_min: 0.07      # “千丝万缕”同步网：|ρ|=阈值时的亮度（加色混合）
  web_opacity_max: 0.6       # |ρ|≈0.85 以上时的亮度
  web_focus_dim: 0.12        # 聚焦时远处板块/连线压暗到的亮度
  transition_ms: 1700        # 点击节点的过渡时长（镜头弧线 + 逐跳点亮）
  reduced_motion_ms: 350     # prefers-reduced-motion 下的缩短过渡
  arc_height: 0.22           # 镜头弧线抬升（相对飞行距离）
  pulse_max: 160             # 同时存在的沿边脉冲上限（单个 Points，一次绘制）
  trail_max: 12              # 探索路径最多保留几步
  suggest_neighbors: 3       # 详情里“最强未探索邻居”条数
  tour_step_ms: 4200         # “从全局到局部”导览每步停留（毫秒）
  default_period: 1          # 默认收益区间（交易日）：1 | 5 | 20
  replay_step_ms: 800        # 逐日回放每天停留（毫秒）
  replay_tween_ms: 650       # 日与日之间光晕/边色的平滑过渡（毫秒）
  replay_loop: false         # 回放到最后一天是否从头循环
  halo_max_scale: 3.4        # 光晕最大半径（相对节点核心，|涨跌|≥封顶时）
  halo_max_opacity: 0.62     # 光晕最大亮度
  halo_up_color: "#ff4d4f"   # A 股习惯：红涨
  halo_down_color: "#22d38a" # 绿跌
  breathe_top_n: 8           # |涨跌| 前 N（且 ≥ 半个封顶）的板块光晕呼吸；超过封顶的也呼吸
  breathe_max: 16            # 同时呼吸的板块上限
  breathe_period_ms: 1600    # 呼吸周期
  breathe_amp: 0.18          # 呼吸幅度（相对亮度/大小）
  edge_tint: true            # 同步边按两端涨跌着色：同涨红、同跌绿、方向相反变暗
  edge_tint_mix: 0.85        # 边着色与社区色的最大混合比例

daily:                       # 逐日板块收益（scripts/reports/sector_daily.py，嵌入 HTML 供回放）
  replay_days: 20            # 回放最近 N 个交易日
  periods: [1, 5, 20]        # 可选收益区间（交易日）；会多嵌入 max(periods)-1 天用于复利
  max_abs_ret: 35.0          # 单只股票日涨跌超过此值（%）视为异常，不计入板块均值
  min_members: 1             # 当日有效成分不足此数则该板块当日记为无行情

graph:                       # 同步图社区与桥梁（scripts/reports/sector_graph.py）
  min_community_size: 3      # 小于此规模的社区并入「零散」
  resolution: 1.0            # greedy modularity 分辨率（>1 更碎，<1 更粗）
  bridge_top_k: 8            # 标记的桥梁板块数
  bridge_min_participation: 0.25  # 跨簇连接占比（参与系数）下限
  name_min_share: 0.45       # 一级行业占比达标则单名，否则取前两名
  name_overrides:            # 簇核心 → 显示名（核心变动时自动回落为行业命名）
    食品加工: 大消费·医药
    基础建设: 基建地产链
    炼化及贸易: 周期原材料
    电池: 新能源·军工电子
    IT服务Ⅱ: TMT
    专用设备: 中游制造
    城商行Ⅱ: 银行保险

stale_weeks: 2               # 关系样本截止日落后行情超过 N 周时，页脚标红提示重算
