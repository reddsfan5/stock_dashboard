# 阅读 / 心法 板块配置（scripts/reports/gen_reading.py 读取）
#
# 新增文章：
#   1. 在 content/reading/<id>/ 放 article.md（图片放同目录 images/，正文用相对路径 images/xxx.png 引用）
#   2. 在下面 articles 里加一条（id 与目录名一致），category 取 categories 里的 id
#   3. 运行：python -m scripts.reports.gen_reading
# 系列：在 series 里登记（id/name/category/description），文章写 series: <id>，
#   同系列文章按 order 排序；书库把同系列合并成一张"X 系列（n 篇）"卡片，文章页显示系列导航，上一篇/下一篇只在系列内跳转。
# 标注语法（::: 提示框、==高亮==、[[术语]]）见 docs/34-阅读板块.md；术语释义统一维护在 config/reading_glossary.yaml。

title: 阅读 · 心法
subtitle: 前辈心法、交易技巧与买卖逻辑的长文精读
output_page: reading.html        # 书库首页（output/ 下）
article_dir: reading             # 文章页输出到 output/reading/<id>.html

layout:                          # 文章页正文栏宽（每行汉字数，随 A−/A+ 字号缩放）
  measure_chars: 56              # 标准：17px 字号约 950px
  wide_chars: 70                 # 宽栏（工具栏"↔ 宽栏"切换）：约 1200px，视口不够时自动收窄

categories:                      # 顺序即书库首页的分区顺序；没有文章的分类显示"待收录"
  - id: masters
    name: 前辈心法
    icon: "☯"
    description: 游资与职业交易者的交易哲学、心路与体系
  - id: value
    name: 价值投资
    icon: "◎"
    description: 以企业价值为锚的长期投资：护城河、安全边际、能力圈与资本配置
  - id: classics
    name: 海外交易经典
    icon: "◈"
    description: 海外投机与交易经典：原著精读，区分本人著作与他人演绎
  - id: techniques
    name: 技巧
    icon: "✦"
    description: 看盘、复盘、仓位等可直接练习的具体技巧
  - id: trade-logic
    name: 买卖逻辑
    icon: "⇄"
    description: 买点、卖点与持仓决策背后的推理链
  # 扩展规划（新增人物时按此归类；分类没有文章时书库显示"待收录"，所以不提前建空分类）：
  #   前辈心法 masters：炒股养家 / Asking / 职业炒手 / 钙片 / 章盟主 / 赵老哥 / 小鳄鱼 / 退学炒股 / 瑞鹤仙
  #   价值投资 value：巴菲特 / 芒格 / 段永平
  #   海外交易经典 classics：利弗莫尔（只引本人 1940 年著作；勒菲弗《回忆录》是半虚构作品，引用须注明）

# 提示框类型：正文用 "::: <type> 可选标题" … ":::" 包裹。
# 以 💡 / ⚠️ 开头的段落或引用会自动套用 emoji_map 对应类型，无需改原文。
callouts:
  core:    {label: 核心心法, icon: "◆", tone: core}
  tip:     {label: 解读, icon: "💡", tone: tip}
  warn:    {label: 警示, icon: "⚠️", tone: warn}
  quote:   {label: 金句, icon: "❝", tone: quote}
  summary: {label: 核心要点, icon: "★", tone: summary, auto_terms: false}   # auto_terms: false → 框内不自动加术语气泡
  note:    {label: 说明, icon: "ⓘ", tone: note, auto_terms: false}
emoji_map:
  "💡": tip
  "⚠️": warn

series:                          # 可选：把多篇文章组织成有序系列（书库合并展示，文章页系列内导航）
