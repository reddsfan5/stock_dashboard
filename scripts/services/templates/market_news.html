<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>市场资讯中心</title>
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/training-context.js"></script>
<style>
/* Page-local: market news desk — tokens from app.css */
.mn-page{
  max-inline-size:min(1320px,100%);
  margin-inline:auto;
  padding:var(--app-space-4) var(--app-space-4) var(--app-space-5);
}
.mn-hero{
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--app-space-3);
  margin-block-end:var(--app-space-4);
}
.mn-hero h1{
  margin:0;font-size:clamp(1.15rem,1rem + 0.8vw,1.45rem);font-weight:750;letter-spacing:-.02em;
}
.mn-hero p{margin:4px 0 0;color:var(--app-muted);font-size:var(--app-fs-sm);max-inline-size:42rem}
.mn-badges{display:flex;flex-wrap:wrap;gap:6px;margin-inline-start:auto}
.mn-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:999px;font-size:11px;font-weight:650;
  background:var(--app-surface);border:1px solid var(--app-border);color:var(--app-muted);
}
.mn-badge strong{color:var(--app-text);font-variant-numeric:tabular-nums}
.mn-badge a{font-weight:650}
.mn-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-block-end:var(--app-space-3)}
.mn-stat{padding:11px 12px;border:1px solid var(--app-border);border-radius:10px;background:var(--app-surface)}
.mn-stat small{display:block;color:var(--app-muted);font-size:10px;font-weight:700}
.mn-stat b{display:block;margin-top:3px;font-size:18px;font-variant-numeric:tabular-nums}
.mn-stat span{font-size:10px;color:var(--app-muted)}
.mn-view-tabs{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--app-border);border-radius:9px;background:var(--app-surface-2)}
.mn-view-tabs button{border:0;background:transparent;color:var(--app-muted);height:30px;padding:0 13px;border-radius:7px;font:inherit;font-size:12px;font-weight:750;cursor:pointer}
.mn-view-tabs button.is-on{background:var(--app-surface);color:var(--app-accent);box-shadow:0 1px 3px rgba(15,23,42,.1)}
.mn-source-note{display:flex;align-items:center;gap:6px;color:var(--app-muted);font-size:11px}

.mn-controls{
  position:sticky;top:calc(var(--app-nav-h) + var(--app-clock-h,0px) + 2px);z-index:20;
  display:grid;gap:var(--app-space-3);
  padding:var(--app-space-3);
  background:color-mix(in srgb,var(--app-surface) 92%,transparent);
  border:1px solid var(--app-border);border-radius:var(--app-radius);
  box-shadow:var(--app-shadow);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  margin-block-end:var(--app-space-4);
}
.mn-controls-row{
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;
}
.mn-field{display:flex;flex-direction:column;gap:5px;min-inline-size:0}
.mn-field label{font-size:11px;font-weight:700;color:var(--app-muted);letter-spacing:.02em}
.mn-field input[type=date],.mn-field input[type=time],.mn-field input[type=search]{
  height:36px;padding:0 10px;min-inline-size:9.5rem;
}
.mn-field input[type=search]{min-inline-size:min(220px,100%)}
.mn-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mn-hint{color:var(--app-muted);font-size:11px;line-height:1.5}

.mn-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mn-chip{
  appearance:none;border:1px solid var(--app-border);background:var(--app-surface);
  color:var(--app-muted);border-radius:999px;height:30px;padding:0 12px;
  font:inherit;font-size:12px;font-weight:650;cursor:pointer;
}
.mn-chip:hover{border-color:#cbd5e1;color:var(--app-text)}
.mn-chip.is-on{
  background:var(--app-accent-soft);border-color:color-mix(in srgb,var(--app-accent) 45%,var(--app-border));
  color:var(--app-accent);
}
.mn-chip .n{margin-inline-start:4px;font-variant-numeric:tabular-nums;opacity:.85}
.mn-seg{
  display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--app-border);
  background:var(--app-surface-2);gap:2px;
}
.mn-seg button{
  height:28px;padding:0 11px;border:0;border-radius:999px;background:transparent;
  color:var(--app-muted);font:inherit;font-size:12px;font-weight:650;cursor:pointer;
}
.mn-seg button.is-on{background:var(--app-surface);color:var(--app-text);box-shadow:0 1px 2px rgba(15,23,42,.08)}

.mn-notice{
  margin-block-end:var(--app-space-3);padding:10px 12px;border-radius:var(--app-radius-sm);
  background:color-mix(in srgb,var(--app-warn) 12%,var(--app-surface));
  color:var(--app-warn);font-size:var(--app-fs-sm);border:1px solid color-mix(in srgb,var(--app-warn) 28%,var(--app-border));
}
.mn-notice[hidden]{display:none}

.mn-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(280px,340px);
  gap:var(--app-space-4);
  align-items:start;
}
.mn-main{min-inline-size:0;display:flex;flex-direction:column;gap:var(--app-space-4)}
.mn-aside{min-inline-size:0;position:sticky;top:calc(var(--app-nav-h) + var(--app-clock-h,0px) + 92px)}

.mn-phase{
  background:var(--app-surface);border:1px solid var(--app-border);
  border-radius:var(--app-radius);box-shadow:var(--app-shadow);overflow:clip;
}
.mn-phase-head{
  position:sticky;top:calc(var(--app-nav-h) + var(--app-clock-h,0px) + 118px);z-index:5;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 14px;border-block-end:1px solid var(--app-border);
  background:color-mix(in srgb,var(--app-surface) 94%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.mn-phase-head h2{margin:0;font-size:15px;font-weight:750}
.mn-phase-head small{display:block;margin-block-start:2px;color:var(--app-muted);font-size:11px;font-weight:500}
.mn-phase-count{
  min-inline-size:2rem;height:28px;padding:0 10px;border-radius:999px;
  display:inline-grid;place-items:center;font-size:12px;font-weight:750;
  font-variant-numeric:tabular-nums;background:var(--app-surface-2);color:var(--app-muted);
  border:1px solid var(--app-border);
}
.mn-phase-pre_open{border-block-start:3px solid #d88400}
.mn-phase-midday{border-block-start:3px solid var(--app-up)}
.mn-phase-close{border-block-start:3px solid var(--app-accent)}
.mn-events{display:grid;gap:10px}
.mn-event{display:grid;grid-template-columns:88px minmax(0,1fr);gap:13px;padding:14px;background:var(--app-surface);border:1px solid var(--app-border);border-radius:var(--app-radius);box-shadow:var(--app-shadow)}
.mn-event-rail{border-right:1px solid var(--app-border);padding-right:12px;color:var(--app-muted);font-size:11px}
.mn-event-rail time{display:block;color:var(--app-text);font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.mn-event-rail span{display:block;margin-top:5px}
.mn-event-head{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.mn-event h3{margin:0;font-size:15px;line-height:1.45}
.mn-event p{margin:7px 0 0;color:var(--app-muted);font-size:12px;line-height:1.6}
.mn-verify{flex:0 0 auto;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;background:var(--app-surface-2);color:var(--app-muted)}
.mn-verify.verified,.mn-verify.corroborated{background:color-mix(in srgb,var(--app-up) 12%,var(--app-surface));color:var(--app-up)}
.mn-verify.cross_reported{background:var(--app-accent-soft);color:var(--app-accent)}
.mn-verify.research{background:color-mix(in srgb,var(--app-warn) 12%,var(--app-surface));color:var(--app-warn)}
.mn-platforms{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.mn-platform{padding:2px 7px;border-radius:999px;background:var(--app-surface-2);color:var(--app-muted);font-size:10px;font-weight:700}
.mn-sources-detail{margin-top:10px;border-top:1px dashed var(--app-border);padding-top:8px}.mn-sources-detail summary{cursor:pointer;color:var(--app-accent);font-size:11px;font-weight:700}.mn-source-row{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--app-border);font-size:11px}.mn-source-row:last-child{border:0}.mn-source-row time{color:var(--app-muted);font-variant-numeric:tabular-nums}.mn-source-row a{color:var(--app-text);font-weight:650;text-decoration:none}

.mn-feed{padding:12px}
.mn-feed.is-masonry{
  column-count:3;column-gap:12px;
}
.mn-feed.is-masonry > .mn-card,
.mn-feed.is-masonry > .app-empty{
  break-inside:avoid;-webkit-column-break-inside:avoid;
  display:inline-block;width:100%;margin:0 0 12px;vertical-align:top;
}
.mn-feed.is-list{display:flex;flex-direction:column;gap:10px}

.mn-card{
  padding:12px 13px;border:1px solid var(--app-border);border-radius:12px;
  background:var(--app-surface);box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:transform var(--app-transition),box-shadow var(--app-transition),border-color var(--app-transition);
  content-visibility:auto;
  contain-intrinsic-size:auto none auto 140px;
}
.mn-card:hover{
  transform:translateY(-2px);
  border-color:color-mix(in srgb,var(--app-accent) 35%,var(--app-border));
  box-shadow:var(--app-shadow);
}
.mn-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:10px;color:var(--app-muted)}
.mn-time{font-weight:800;color:var(--app-text);font-variant-numeric:tabular-nums}
.mn-tag{
  padding:2px 7px;border-radius:999px;background:var(--app-accent-soft);color:var(--app-accent);font-weight:650;
}
.mn-card h3{
  margin:8px 0 6px;font-size:14px;line-height:1.45;font-weight:700;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.mn-card p{
  margin:0;color:var(--app-muted);font-size:12px;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
}
.mn-card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-block-start:10px}
.mn-card-actions a,.mn-card-actions button{
  font-size:11px;height:30px;padding:0 10px;border-radius:8px;font-weight:650;
}
.mn-impact-btn{
  border:1px solid color-mix(in srgb,#6253a9 35%,var(--app-border));
  background:color-mix(in srgb,#6253a9 8%,var(--app-surface));color:#6253a9;cursor:pointer;font:inherit;
}
.mn-impact-btn:hover{filter:brightness(0.98)}

.mn-journal{
  background:var(--app-surface);border:1px solid var(--app-border);
  border-radius:var(--app-radius);box-shadow:var(--app-shadow);overflow:clip;
}
.mn-journal-head{padding:12px 14px;border-block-end:1px solid var(--app-border)}
.mn-journal-head h2{margin:0;font-size:14px;font-weight:750}
.mn-journal-head p{margin:4px 0 0;color:var(--app-muted);font-size:11px;line-height:1.5}
.mn-impact{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;
  padding:12px 14px;border-block-start:1px solid var(--app-border);
}
.mn-impact-when{font-size:11px;color:var(--app-muted)}
.mn-impact-when b{display:block;color:var(--app-text);font-size:12px;margin-block-end:2px;font-variant-numeric:tabular-nums}
.mn-impact-body strong{display:block;font-size:12px;line-height:1.4}
.mn-impact-body p{margin:4px 0 0;color:var(--app-muted);font-size:11px;line-height:1.5}
.mn-delete{
  height:28px;padding:0 8px;font-size:11px;border-radius:7px;cursor:pointer;font:inherit;font-weight:650;
  color:var(--app-up);border:1px solid color-mix(in srgb,var(--app-up) 30%,var(--app-border));
  background:color-mix(in srgb,var(--app-up) 6%,var(--app-surface));
}

.mn-modal{position:fixed;inset:0;z-index:1200;display:grid;place-items:center;padding:18px}
.mn-modal[hidden]{display:none}
.mn-backdrop{position:absolute;inset:0;background:rgba(10,18,32,.55);backdrop-filter:blur(2px)}
.mn-dialog{
  position:relative;inline-size:min(560px,100%);max-block-size:calc(100dvh - 36px);overflow:auto;
  background:var(--app-surface);border:1px solid var(--app-border);border-radius:14px;
  padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.28);
}
.mn-dialog h2{margin:0 0 6px;font-size:17px}
.mn-picked{margin:0 0 14px;color:var(--app-muted);font-size:12px;line-height:1.55}
.mn-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mn-form .full{grid-column:1/-1}
.mn-form label{display:block;font-size:11px;font-weight:700;color:var(--app-muted);margin-block-end:5px}
.mn-form input,.mn-form select,.mn-form textarea{width:100%;padding:9px 10px}
.mn-dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-block-start:14px}

.mn-loading{
  position:fixed;inset-inline-end:18px;inset-block-end:18px;z-index:1300;
  padding:9px 13px;border-radius:9px;background:#0f172a;color:#fff;font-size:12px;font-weight:650;
  box-shadow:var(--app-shadow);
}
.mn-loading[hidden]{display:none}

@media (max-width:1100px){
  .mn-layout{grid-template-columns:1fr}
  .mn-aside{position:static}
  .mn-feed.is-masonry{column-count:2}
  .mn-phase-head{top:calc(var(--app-nav-h) + 8px)}
}
.mn-tools > summary{display:none;list-style:none;cursor:pointer}
.mn-tools > summary::-webkit-details-marker{display:none}
.mn-tools-summary-text{min-inline-size:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mn-tools-toggle{display:none}
.mn-filter-done{display:none}
@media (min-width:641px){
  .mn-tools{display:contents}
  .mn-filter-panel{display:contents}
}
@media (max-width:640px){
  .mn-page{padding:8px 8px 12px}
  .mn-hero{display:none}
  .mn-feed.is-masonry{column-count:1}
  .mn-form{grid-template-columns:1fr}
  .mn-form .full{grid-column:auto}
  .mn-controls{
    top:calc(var(--app-nav-h) + 2px);
    gap:6px;padding:8px;margin-block-end:8px;
    border-radius:10px;
  }
  .mn-summary{display:none}
  .mn-tools > summary{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    min-height:40px;padding:7px 10px;margin-block-end:0;
    border:1px solid var(--app-border);border-radius:10px;
    background:var(--app-surface-2);color:var(--app-text);
    font-size:12px;font-weight:650;
  }
  .mn-tools-toggle{
    display:inline-flex;align-items:center;flex:none;
    height:26px;padding:0 10px;border-radius:999px;
    background:var(--app-accent-soft);color:var(--app-accent);
    font-size:11px;font-weight:750;
  }
  .mn-tools[open] .mn-tools-toggle{background:var(--app-surface);border:1px solid var(--app-border);color:var(--app-text)}
  .mn-tools[open] > summary{margin-block-end:8px}
  .mn-filter-panel{display:grid;gap:8px}
  .mn-chips{
    flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;
    -webkit-overflow-scrolling:touch;scrollbar-width:thin;padding-block-end:2px;
  }
  .mn-chip{flex:0 0 auto}
  .mn-filter-done{
    display:block;width:100%;height:36px;margin-block-start:2px;
    border:0;border-radius:9px;cursor:pointer;font:inherit;font-size:13px;font-weight:750;
    background:var(--app-accent);color:#fff;
  }
  .mn-controls-row{gap:6px}
  .mn-field{flex:1 1 calc(50% - 6px);gap:3px}
  .mn-field:has(input[type=search]){flex:1 1 100%}
  .mn-field label{font-size:10px}
  .mn-field input[type=date],.mn-field input[type=time],.mn-field input[type=search]{
    height:32px;min-inline-size:0;width:100%;padding:0 8px;font-size:13px;
  }
  .mn-actions{width:100%;gap:6px}
  .mn-actions .btn{flex:1;min-inline-size:0;height:32px;padding:0 6px;font-size:12px}
  .mn-hint{display:none}
  .mn-seg{display:none}
  .mn-chips{gap:5px}
  .mn-chip{height:26px;padding:0 9px;font-size:11px}
  .mn-phase-head{
    top:calc(var(--app-nav-h) + 4px);
    padding:8px 10px;
  }
  .mn-phase-head h2{font-size:13px}
  .mn-phase-head small{display:none}
  .mn-phase-count{height:24px;font-size:11px}
  .mn-feed{padding:8px}
  .mn-feed.is-list{gap:8px}
  .mn-feed.is-masonry > .mn-card{margin:0 0 8px}
  .mn-card{padding:9px 10px;border-radius:10px}
  .mn-card:hover{transform:none}
  .mn-card h3{margin:5px 0 4px;font-size:13px;-webkit-line-clamp:2}
  .mn-card p{-webkit-line-clamp:2;font-size:11px;line-height:1.45}
  .mn-card-actions{margin-block-start:8px;gap:6px}
  .mn-card-actions a,.mn-card-actions button{height:28px;font-size:11px;padding:0 8px}
  .mn-aside{margin-block-start:4px}
  .mn-journal-head{padding:10px 12px}
  .mn-journal-head p{display:none}
  .mn-summary{grid-template-columns:1fr 1fr;gap:6px}.mn-stat{padding:8px 9px}.mn-stat b{font-size:15px}
  .mn-event{grid-template-columns:1fr;padding:10px}.mn-event-rail{display:flex;gap:8px;align-items:center;border-right:0;border-bottom:1px solid var(--app-border);padding:0 0 8px}.mn-event-rail time{font-size:14px}.mn-event-rail span{margin:0}
  .mn-event-head{display:block}.mn-verify{display:inline-block;margin-bottom:6px}.mn-source-note{display:none}
}
@media (prefers-reduced-motion:reduce){
  .mn-card{transition:none}
  .mn-card:hover{transform:none}
}
:root[data-theme=dark] .mn-controls,
:root[data-theme=dark] .mn-phase-head{
  background:color-mix(in srgb,var(--app-surface) 88%,transparent);
}
:root[data-theme=dark] .mn-seg button.is-on{box-shadow:0 1px 2px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div id="app-shell" data-active="news"></div>
<main class="mn-page">
  <header class="mn-hero">
    <div>
      <h1>市场资讯中心</h1>
      <p>同一事件合并多家来源，区分官方确认、媒体报道与社区线索；训练时严格保留截止时刻。</p>
    </div>
    <div class="mn-badges">
      <a class="btn" id="briefLink" href="/market_brief.html">盘前 / 收盘简报</a>
      <span class="mn-badge">范围 <strong id="scope">—</strong></span>
      <span class="mn-badge">缓存 <strong id="cache">—</strong></span>
      <span class="mn-badge">来源 <strong id="source">—</strong></span>
    </div>
  </header>

  <section class="mn-summary" id="summary" aria-label="资讯概览"></section>

  <section class="mn-controls" aria-label="筛选与时间">
    <details class="mn-tools" id="mnTools">
      <summary>
        <span class="mn-tools-summary-text" id="toolsSummary">筛选与时间</span>
        <span class="mn-tools-toggle" id="toolsToggle" aria-hidden="true">筛选</span>
      </summary>
      <div class="mn-filter-panel">
        <div class="mn-controls-row">
          <div class="mn-view-tabs" role="tablist" aria-label="资讯视图">
            <button type="button" id="viewEvents" class="is-on">事件聚合</button>
            <button type="button" id="viewFeed">实时流</button>
          </div>
          <div class="mn-field"><label for="marketDate">行情日期</label><input id="marketDate" type="date"></div>
          <div class="mn-field"><label for="asOf">截至时刻</label><input id="asOf" type="time" step="60"></div>
          <div class="mn-field"><label for="q">关键词</label><input id="q" type="search" placeholder="标题 / 摘要 / 标签" autocomplete="off"></div>
          <div class="mn-actions">
            <button class="btn btn-primary" type="button" id="load">按时点查看</button>
            <button class="btn" type="button" id="fullDay">查看全天</button>
            <button class="btn" type="button" id="refresh">刷新同花顺</button>
          </div>
          <div class="mn-seg" role="group" aria-label="布局">
            <button type="button" id="viewMasonry" class="is-on">瀑布</button>
            <button type="button" id="viewList">列表</button>
          </div>
        </div>
        <p class="mn-hint">早盘 = 09:30 前 · 午间 = 09:30–12:59 · 收盘 = 13:00 后。无剧透训练请保留截止时刻。</p>
        <div class="mn-chips" id="phaseChips" role="tablist" aria-label="时段"></div>
        <div class="mn-chips" id="sourceChips" role="tablist" aria-label="来源"></div>
        <div class="mn-chips" id="tagChips" hidden></div>
        <div class="mn-source-note">来源等级：官方确认 ＞ 权威印证 ＞ 多源报道 ＞ 单源报道 ＞ 社区研究线索。多源不等于事实，仍应打开原文核对。</div>
        <button type="button" class="mn-filter-done" id="mnFilterDone">看资讯</button>
      </div>
    </details>
  </section>

  <div class="mn-notice" id="notice" hidden></div>

  <div class="mn-layout">
    <div class="mn-main">
      <section class="mn-timeline" id="timeline" aria-live="polite"></section>
    </div>
    <aside class="mn-aside">
      <section class="mn-journal">
        <div class="mn-journal-head">
          <h2>消息影响记录</h2>
          <p>写下当时为何重要，不要事后按涨跌改写理由。</p>
        </div>
        <div id="impacts"></div>
      </section>
    </aside>
  </div>
</main>

<div class="mn-modal" id="impactModal" hidden>
  <div class="mn-backdrop" id="backdrop"></div>
  <section class="mn-dialog" role="dialog" aria-modal="true" aria-labelledby="impactTitle">
    <h2 id="impactTitle">记录这条消息如何影响判断</h2>
    <p class="mn-picked" id="pickedNews">—</p>
    <div class="mn-form">
      <div><label for="impactCode">关联标的（可选）</label><input id="impactCode" placeholder="如 600519 或 sh600519"></div>
      <div><label for="decisionTime">当时决策时刻</label><input id="decisionTime" type="time" step="60"></div>
      <div><label for="impactAction">影响的动作</label>
        <select id="impactAction">
          <option value="watch">观望</option><option value="select">纳入候选</option>
          <option value="buy">买入</option><option value="hold">持有</option>
          <option value="sell">卖出</option><option value="avoid">回避</option>
        </select>
      </div>
      <div><label for="impactStance">当时理解</label>
        <select id="impactStance">
          <option value="uncertain">不确定</option><option value="bullish">偏利多</option>
          <option value="bearish">偏利空</option><option value="neutral">中性</option>
        </select>
      </div>
      <div class="full"><label for="impactNote">影响说明</label>
        <textarea id="impactNote" rows="4" maxlength="2000" placeholder="例如：政策超预期，把证券 ETF 加入午后观察，等待量价确认"></textarea>
      </div>
    </div>
    <div class="mn-dialog-actions">
      <button class="btn" type="button" id="cancelImpact">取消</button>
      <button class="btn btn-primary" type="button" id="saveImpact">保存影响记录</button>
    </div>
  </section>
</div>
<div class="mn-loading" id="loading" hidden>正在读取重要资讯…</div>

<script>
const $=id=>document.getElementById(id);
let payload=null,pickedId=null,phaseFilter='all',tagFilter='',sourceFilter='',viewMode='masonry',displayMode='events';
const phases=['pre_open','midday','close'];
const labels={pre_open:'早盘',midday:'午间',close:'收盘'};
const phaseHints={pre_open:'开盘前已知',midday:'上午盘中与午休',close:'午后与收盘后'};
const actionNames={watch:'观望',select:'纳入候选',buy:'买入',hold:'持有',sell:'卖出',avoid:'回避'};
const stanceNames={bullish:'偏利多',bearish:'偏利空',neutral:'中性',uncertain:'不确定'};

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,method='GET',body=null){
  const o={method,cache:'no-store',headers:{}};
  if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
  const r=await fetch(path,o);let x={};try{x=await r.json()}catch(e){}
  if(!r.ok)throw new Error(x.error||`HTTP ${r.status}`);return x;
}
function setLoading(on){$('loading').hidden=!on}
function message(text){$('notice').textContent=text||'';$('notice').hidden=!text}
function query(){const q=new URLSearchParams({date:$('marketDate').value});if($('asOf').value)q.set('as_of',$('asOf').value);return q}

function filteredItems(){
  if(!payload)return [];
  const q=($('q').value||'').trim().toLowerCase();
  return payload.items.filter(x=>{
    if(phaseFilter!=='all' && x.phase!==phaseFilter)return false;
    if(sourceFilter && x.platform_key!==sourceFilter)return false;
    if(tagFilter && !(x.tags||[]).includes(tagFilter))return false;
    if(!q)return true;
    const hay=[x.title,x.digest,...(x.tags||[])].join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function filteredEvents(){
  if(!payload)return [];
  const q=($('q').value||'').trim().toLowerCase();
  return (payload.events||[]).filter(x=>{
    if(phaseFilter!=='all' && x.phase!==phaseFilter)return false;
    if(sourceFilter && !(x.platforms||[]).some(p=>p.key===sourceFilter))return false;
    if(tagFilter && !(x.tags||[]).includes(tagFilter))return false;
    if(!q)return true;
    return [x.title,x.digest,x.original_source,...(x.tags||[])].join(' ').toLowerCase().includes(q);
  });
}

function renderChips(){
  const counts=Object.fromEntries(phases.map(p=>[p,0]));
  (payload?.items||[]).forEach(x=>{if(counts[x.phase]!=null)counts[x.phase]++});
  const total=payload?.items?.length||0;
  const chip=(id,label,n,on)=>`<button type="button" class="mn-chip${on?' is-on':''}" data-phase="${id}" role="tab" aria-selected="${on}">${label}<span class="n">${n}</span></button>`;
  $('phaseChips').innerHTML=[
    chip('all','全部',total,phaseFilter==='all'),
    ...phases.map(p=>chip(p,labels[p],counts[p],phaseFilter===p))
  ].join('');

  const sources=payload?.source_summary||[];
  $('sourceChips').innerHTML=`<button type="button" class="mn-chip${!sourceFilter?' is-on':''}" data-source="">来源·全部<span class="n">${sources.length}</span></button>`+
    sources.map(x=>`<button type="button" class="mn-chip${sourceFilter===x.key?' is-on':''}" data-source="${esc(x.key)}">${esc(x.name)}<span class="n">${x.count}</span></button>`).join('');

  const tagMap=new Map();
  (payload?.items||[]).forEach(x=>{(x.tags||[]).forEach(t=>tagMap.set(t,(tagMap.get(t)||0)+1))});
  const tags=[...tagMap.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10);
  if(!tags.length){$('tagChips').hidden=true;$('tagChips').innerHTML='';return}
  $('tagChips').hidden=false;
  $('tagChips').innerHTML=`<button type="button" class="mn-chip${!tagFilter?' is-on':''}" data-tag="">标签·全部</button>`+
    tags.map(([t,n])=>`<button type="button" class="mn-chip${tagFilter===t?' is-on':''}" data-tag="${esc(t)}">${esc(t)}<span class="n">${n}</span></button>`).join('');
}

function renderSummary(){
  const events=payload?.events||[],v=payload?.verification_counts||{},sources=payload?.source_summary||[];
  const confirmed=(v.verified||0)+(v.corroborated||0)+(v.cross_reported||0);
  $('summary').innerHTML=`
    <div class="mn-stat"><small>可见事件</small><b>${events.length}</b><span>已合并重复报道</span></div>
    <div class="mn-stat"><small>已确认 / 多源</small><b>${confirmed}</b><span>需继续核对原文</span></div>
    <div class="mn-stat"><small>社区研究线索</small><b>${v.research||0}</b><span>不可直接视为事实</span></div>
    <div class="mn-stat"><small>已覆盖平台</small><b>${sources.length}</b><span>${sources.map(x=>x.name).slice(0,3).join(' · ')||'等待导入'}</span></div>`;
}

function newsCard(x){
  const tags=(x.tags||[]).slice(0,3).map(t=>`<span class="mn-tag">${esc(t)}</span>`).join('');
  return `<article class="mn-card app-reveal">
    <div class="mn-meta"><span class="mn-time">${esc((x.time||'').slice(0,5))}</span>${tags}</div>
    <h3>${esc(x.title)}</h3>
    ${x.digest?`<p>${esc(x.digest)}</p>`:''}
    <div class="mn-card-actions">
      ${x.url?`<a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">原文</a>`:''}
      <button type="button" class="mn-impact-btn" data-impact="${esc(x.id)}">记录影响</button>
    </div>
  </article>`;
}

function eventCard(x){
  const platforms=(x.platforms||[]).map(p=>`<span class="mn-platform">${esc(p.name)}</span>`).join('');
  const tags=(x.tags||[]).slice(0,5).map(t=>`<span class="mn-tag">${esc(t)}</span>`).join('');
  const rows=(x.items||[]).map(row=>`<div class="mn-source-row"><time>${esc((row.time||'').slice(0,5))}</time><div>${row.url?`<a href="${esc(row.url)}" target="_blank" rel="noopener">${esc(row.platform_name||row.source)}</a>`:`<b>${esc(row.platform_name||row.source)}</b>`}<div>${esc(row.title)}</div></div></div>`).join('');
  return `<article class="mn-event app-reveal" id="${esc(x.event_id)}">
    <div class="mn-event-rail"><time>${esc((x.time||'').slice(0,5))}</time><span>${esc(labels[x.phase]||x.phase)}</span><span>${x.source_count} 个平台</span></div>
    <div><div class="mn-event-head"><div><span class="mn-verify ${esc(x.verification_status)}">${esc(x.verification_label)}</span><h3>${esc(x.title)}</h3></div></div>
    ${x.digest?`<p>${esc(x.digest)}</p>`:''}<div class="mn-platforms">${platforms}${tags}</div>
    <div class="mn-card-actions"><button type="button" class="mn-impact-btn" data-impact="${esc(x.primary_news_id)}">记录影响</button></div>
    <details class="mn-sources-detail"><summary>查看 ${x.items?.length||0} 条来源记录</summary>${rows}</details></div>
  </article>`;
}

function render(){
  if(!payload)return;
  const asof=payload.as_of?`截至 ${payload.as_of.slice(0,5)}（无剧透）`:'全天复盘';
  const scopeText=`${payload.market_date} · ${asof} · ${payload.items.length} 条`;
  $('scope').textContent=scopeText;
  const tools=$('toolsSummary');
  if(tools){
    const shortAsof=payload.as_of?`截至${payload.as_of.slice(0,5)}`:'全天';
    const phaseLabel=phaseFilter==='all'?'':(labels[phaseFilter]||'');
    const sourceName=(payload.source_summary||[]).find(x=>x.key===sourceFilter)?.name||'';
    const extras=[phaseLabel,sourceName,tagFilter].filter(Boolean);
    const n=displayMode==='events'?filteredEvents().length:filteredItems().length;
    tools.textContent=[payload.market_date,shortAsof,`${n}条`,...extras].join(' · ');
  }
  const toggle=$('toolsToggle');
  if(toggle){
    const d=$('mnTools');
    toggle.textContent=d&&d.open?'收起':'筛选';
  }
  $('cache').textContent=payload.fetched_at?payload.fetched_at.replace('T',' ').slice(0,16):'尚无';
  $('source').textContent=`${(payload.source_summary||[]).length}个平台`;
  $('briefLink').href=`/market_brief.html?date=${encodeURIComponent(payload.market_date)}`;
  if(payload.message)message(payload.message); else if(!$('notice').dataset.sticky)message('');
  renderChips();
  renderSummary();

  if(displayMode==='events'){
    const events=filteredEvents();
    $('timeline').innerHTML=events.length?`<div class="mn-events">${events.map(eventCard).join('')}</div>`:'<div class="app-empty">当前筛选下没有事件。试试清空关键词或切换来源。</div>';
    if(window.StockAppShell&&StockAppShell.observeReveal)StockAppShell.observeReveal($('timeline'));
    const focus=new URL(location.href).searchParams.get('event');if(focus)requestAnimationFrame(()=>document.getElementById(focus)?.scrollIntoView({block:'center'}));
    return;
  }

  const items=filteredItems();
  const grouped=Object.fromEntries(phases.map(p=>[p,[]]));
  items.forEach(x=>(grouped[x.phase]||grouped.close).push(x));
  const showPhases=phaseFilter==='all'?phases:[phaseFilter];
  const feedClass=viewMode==='list'?'mn-feed is-list':'mn-feed is-masonry';

  if(!items.length){
    $('timeline').innerHTML=`<div class="app-empty">当前筛选下没有资讯。试试清空关键词或切换时段。</div>`;
  }else{
    $('timeline').innerHTML=showPhases.map(p=>{
      const rows=grouped[p]||[];
      return `<section class="mn-phase mn-phase-${p}">
        <header class="mn-phase-head"><div><h2>${labels[p]}</h2><small>${phaseHints[p]}</small></div>
        <span class="mn-phase-count">${rows.length}</span></header>
        <div class="${feedClass}">${rows.length?rows.map(newsCard).join(''):'<div class="app-empty">该时段没有重要资讯</div>'}</div>
      </section>`;
    }).join('');
  }
  if(window.StockAppShell&&StockAppShell.observeReveal)StockAppShell.observeReveal($('timeline'));
}

async function loadImpacts(){
  const q=new URLSearchParams({date:$('marketDate').value});
  const code=new URL(location.href).searchParams.get('code');
  if(code)q.set('code',code);
  try{
    const rows=await api('/api/news/impacts?'+q);
    $('impacts').innerHTML=rows.length?rows.map(impactCard).join(''):'<div class="app-empty" style="margin:12px;border:0">当天尚未记录</div>';
  }catch(e){$('impacts').innerHTML=`<div class="app-error" style="margin:12px">${esc(e.message)}</div>`}
}
function impactCard(x){
  return `<div class="mn-impact">
    <div>
      <div class="mn-impact-when"><b>${esc(x.decision_time?.slice(0,5)||'未填时刻')}</b>${esc(x.code||'市场整体')} · ${stanceNames[x.stance]||x.stance}</div>
      <div class="mn-impact-body"><strong>${actionNames[x.action]||x.action}｜${esc(x.news_title)}</strong><p>${esc(x.note)}</p></div>
    </div>
    <button type="button" class="mn-delete" data-delete="${x.id}">删除</button>
  </div>`;
}

async function load(refresh=false){
  if(!$('marketDate').value)return;
  setLoading(true);message('');
  try{
    const q=query();if(refresh)q.set('refresh','1');
    payload=await api('/api/news/day?'+q);
    render();await loadImpacts();syncUrl();
  }catch(e){message(e.message)}
  finally{setLoading(false)}
}
function syncUrl(){
  const u=new URL(location.href);
  u.searchParams.set('date',$('marketDate').value);
  if($('asOf').value)u.searchParams.set('as_of',$('asOf').value);else u.searchParams.delete('as_of');
  history.replaceState(null,'',u);
}
function openImpact(id){
  const item=payload.items.find(x=>x.id===id);if(!item)return;
  pickedId=id;
  $('pickedNews').textContent=`${item.time.slice(0,5)}｜${item.title}`;
  $('decisionTime').value=$('asOf').value||item.time.slice(0,5);
  $('impactCode').value=new URL(location.href).searchParams.get('code')||'';
  $('impactNote').value='';
  $('impactModal').hidden=false;
  $('impactNote').focus();
}
function closeImpact(){$('impactModal').hidden=true;pickedId=null}
async function saveImpact(){
  const body={news_id:pickedId,market_date:$('marketDate').value,decision_time:$('decisionTime').value,
    code:$('impactCode').value,action:$('impactAction').value,stance:$('impactStance').value,note:$('impactNote').value};
  try{await api('/api/news/impact','POST',body);closeImpact();await loadImpacts()}
  catch(e){message(e.message)}
}
function setView(mode){
  viewMode=mode;
  $('viewMasonry').classList.toggle('is-on',mode==='masonry');
  $('viewList').classList.toggle('is-on',mode==='list');
  render();
}
function setDisplay(mode){displayMode=mode;$('viewEvents').classList.toggle('is-on',mode==='events');$('viewFeed').classList.toggle('is-on',mode==='feed');render()}

$('load').onclick=()=>load(false);
$('fullDay').onclick=()=>{$('asOf').value='';load(false)};
$('refresh').onclick=()=>load(true);
$('cancelImpact').onclick=closeImpact;
$('backdrop').onclick=closeImpact;
$('saveImpact').onclick=saveImpact;
$('viewMasonry').onclick=()=>setView('masonry');
$('viewList').onclick=()=>setView('list');
$('viewEvents').onclick=()=>setDisplay('events');
$('viewFeed').onclick=()=>setDisplay('feed');
$('q').oninput=()=>{if(payload)render()};
$('phaseChips').onclick=e=>{const b=e.target.closest('[data-phase]');if(!b)return;phaseFilter=b.dataset.phase;render()};
$('tagChips').onclick=e=>{const b=e.target.closest('[data-tag]');if(!b)return;tagFilter=b.dataset.tag||'';render()};
$('sourceChips').onclick=e=>{const b=e.target.closest('[data-source]');if(!b)return;sourceFilter=b.dataset.source||'';render()};
$('timeline').onclick=e=>{const b=e.target.closest('[data-impact]');if(b)openImpact(b.dataset.impact)};
$('impacts').onclick=async e=>{
  const b=e.target.closest('[data-delete]');
  if(b&&confirm('删除这条消息影响记录？')){
    try{await api('/api/news/impact/delete','POST',{impact_id:b.dataset.delete});await loadImpacts()}
    catch(err){message(err.message)}
  }
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('impactModal').hidden)closeImpact()});

const u=new URL(location.href);
const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'});
$('marketDate').value=u.searchParams.get('date')||today;
$('asOf').value=(u.searchParams.get('as_of')||'').slice(0,5);
(function syncToolsOpen(){
  const d=$('mnTools'); if(!d)return;
  const wide=window.matchMedia('(min-width:641px)');
  const key='mn-news-filters-open';
  const apply=()=>{
    if(wide.matches){d.open=true;return;}
    const saved=sessionStorage.getItem(key);
    d.open=saved==='1';
  };
  const syncToggle=()=>{
    const toggle=$('toolsToggle');
    if(toggle)toggle.textContent=d.open?'收起':'筛选';
    if(!wide.matches)sessionStorage.setItem(key,d.open?'1':'0');
  };
  apply();
  syncToggle();
  d.addEventListener('toggle',syncToggle);
  const done=$('mnFilterDone');
  if(done)done.onclick=()=>{d.open=false};
  if(wide.addEventListener)wide.addEventListener('change',apply); else wide.addListener(apply);
})();
load(false);
</script>
<script src="/assets/app-shell.js"></script>
</body>
</html>
