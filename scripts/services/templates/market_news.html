<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>市场资讯复盘</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#778196;--line:#e3e7ee;--blue:#3478f6;--red:#e5484d;--green:#159568;--orange:#d88400;--shadow:0 8px 28px rgba(24,39,75,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.page{max-width:1240px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:16px;margin-bottom:14px}.top h1{font-size:24px;margin:0}.top p{margin:4px 0 0;color:var(--muted);font-size:13px}.links{margin-left:auto;display:flex;gap:12px}.links a{color:var(--blue);text-decoration:none;font-size:13px}.toolbar{display:grid;grid-template-columns:170px 150px auto auto auto;gap:10px;align-items:end;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}label{display:block;color:#667085;font-size:11px;font-weight:700;margin-bottom:5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #ccd3df;border-radius:8px;background:#fff;color:var(--text);padding:9px 10px}button{border:1px solid #cdd4df;border-radius:8px;background:#fff;color:#344054;padding:9px 13px;cursor:pointer}.primary{border-color:var(--blue);background:var(--blue);color:#fff}.toolbar-note{grid-column:1/-1;padding-top:3px;color:var(--muted);font-size:11px;line-height:1.5}.status{display:flex;align-items:center;gap:9px;margin:13px 0;color:var(--muted);font-size:12px}.status b{color:#475467}.status .source{margin-left:auto}.status a{color:var(--blue);text-decoration:none}.notice{padding:9px 12px;margin:10px 0;border-radius:8px;background:#fff6dd;color:#805b00;font-size:12px}.timeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;align-items:start}.phase{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow)}.phase-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96)}.phase-head h2{font-size:16px;margin:0}.phase-head small{color:var(--muted)}.phase-pre_open .phase-head{border-top:3px solid var(--orange)}.phase-midday .phase-head{border-top:3px solid var(--red)}.phase-close .phase-head{border-top:3px solid var(--blue)}.news-list{padding:2px 13px 12px}.news{padding:13px 1px;border-bottom:1px solid #edf0f4}.news:last-child{border-bottom:0}.news-meta{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px}.news-time{font-weight:800;color:#475467;font-variant-numeric:tabular-nums}.tag{padding:2px 6px;border-radius:10px;background:#eef3ff;color:#4d67a5}.news h3{font-size:14px;line-height:1.45;margin:7px 0}.news p{margin:0;color:#5e687a;font-size:12px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.news-actions{display:flex;gap:8px;margin-top:9px}.news-actions a,.news-actions button{font-size:11px;padding:6px 9px;text-decoration:none;border-radius:7px}.news-actions a{color:var(--blue);border:1px solid #cbd9f6}.impact-btn{color:#6253a9;border-color:#d2caef;background:#f7f5ff}.empty{padding:32px 10px;text-align:center;color:#98a2b3;font-size:12px}.review{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;box-shadow:var(--shadow)}.review h2{font-size:17px;margin:0 0 4px}.review-intro{margin:0 0 12px;color:var(--muted);font-size:11px}.impact{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;padding:11px 0;border-top:1px solid #edf0f4}.impact-label{font-size:11px;color:var(--muted)}.impact-label b{display:block;color:#344054;font-size:12px;margin-bottom:4px}.impact-body strong{display:block;font-size:13px}.impact-body p{margin:5px 0 0;color:#596579;font-size:12px;line-height:1.55}.delete{padding:5px 8px;color:#a33;border-color:#efcaca;background:#fff}.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}.modal[hidden]{display:none}.backdrop{position:absolute;inset:0;background:rgba(10,18,32,.58)}.dialog{position:relative;width:min(560px,100%);max-height:calc(100dvh - 36px);overflow:auto;background:#fff;border-radius:15px;padding:18px;box-shadow:0 20px 70px rgba(0,0,0,.25)}.dialog h2{font-size:18px;margin:0 0 6px}.picked{margin:0 0 14px;color:#5d687c;font-size:12px;line-height:1.55}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.loading{position:fixed;right:18px;bottom:18px;padding:9px 13px;border-radius:9px;background:#172033;color:#fff;font-size:12px;box-shadow:var(--shadow)}.loading[hidden]{display:none}@media(max-width:900px){.timeline{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.impact{grid-template-columns:1fr auto}.impact-label{grid-column:1/-1}.top{align-items:flex-start}.links{flex-direction:column;gap:4px}}@media(max-width:560px){.page{padding:10px}.top h1{font-size:19px}.top p{font-size:11px}.toolbar{grid-template-columns:1fr}.toolbar-note{grid-column:auto}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.status{align-items:flex-start;flex-wrap:wrap}.status .source{margin-left:0;width:100%}}
</style>
</head>
<body>
<main class="page">
  <header class="top"><div><h1>📰 市场资讯复盘</h1><p>只看市场级重要消息，并按当时可见时刻回放</p></div><nav class="links"><a href="trading_trainer.html">交易训练</a><a href="stock_journal.html">选股日记</a><a href="index.html">返回导航</a></nav></header>
  <section class="toolbar">
    <div><label for="marketDate">行情日期</label><input id="marketDate" type="date"></div>
    <div><label for="asOf">只看截至时刻</label><input id="asOf" type="time" step="60"></div>
    <button class="primary" id="load">按时点查看</button><button id="fullDay">查看全天</button><button id="refresh">刷新同花顺</button>
    <div class="toolbar-note">无剧透训练时请保留截止时刻；全天复盘时再点“查看全天”。早盘为 09:30 前，午间为 09:30–12:59，收盘为 13:00 后。</div>
  </section>
  <div class="notice" id="notice" hidden></div>
  <div class="status"><b id="scope">—</b><span id="cache">—</span><span class="source">来源：<a id="source" target="_blank" rel="noopener">同花顺7×24重要资讯</a> · 本页不构成投资建议</span></div>
  <section class="timeline" id="timeline"></section>
  <section class="review"><h2>我的消息影响记录</h2><p class="review-intro">记录“当时为什么认为它重要”，不要在事后只按涨跌结果改写理由。</p><div id="impacts"></div></section>
</main>
<div class="modal" id="impactModal" hidden><div class="backdrop" id="backdrop"></div><section class="dialog" role="dialog" aria-modal="true"><h2>记录这条消息如何影响判断</h2><p class="picked" id="pickedNews">—</p><div class="form-grid">
  <div><label for="impactCode">关联标的（可选）</label><input id="impactCode" placeholder="如 520500"></div>
  <div><label for="decisionTime">当时决策时刻</label><input id="decisionTime" type="time" step="60"></div>
  <div><label for="impactAction">影响的动作</label><select id="impactAction"><option value="watch">观望</option><option value="select">纳入候选</option><option value="buy">买入</option><option value="hold">持有</option><option value="sell">卖出</option><option value="avoid">回避</option></select></div>
  <div><label for="impactStance">当时理解</label><select id="impactStance"><option value="uncertain">不确定</option><option value="bullish">偏利多</option><option value="bearish">偏利空</option><option value="neutral">中性</option></select></div>
  <div class="full"><label for="impactNote">影响说明</label><textarea id="impactNote" rows="4" maxlength="2000" placeholder="例如：政策超预期，决定把证券ETF加入午后观察，但等待量价确认"></textarea></div>
 </div><div class="dialog-actions"><button id="cancelImpact">取消</button><button class="primary" id="saveImpact">保存影响记录</button></div></section></div>
<div class="loading" id="loading" hidden>正在读取重要资讯…</div>
<script>
const $=id=>document.getElementById(id);let payload=null,pickedId=null;
const phases=['pre_open','midday','close'],labels={pre_open:'早盘',midday:'午间',close:'收盘'},phaseHints={pre_open:'开盘前已知',midday:'上午盘中与午休',close:'午后与收盘后'};
const actionNames={watch:'观望',select:'纳入候选',buy:'买入',hold:'持有',sell:'卖出',avoid:'回避'},stanceNames={bullish:'偏利多',bearish:'偏利空',neutral:'中性',uncertain:'不确定'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,method='GET',body=null){const o={method,cache:'no-store',headers:{}};if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}const r=await fetch(path,o);let x={};try{x=await r.json()}catch(e){}if(!r.ok)throw new Error(x.error||`HTTP ${r.status}`);return x}
function setLoading(on){$('loading').hidden=!on}
function message(text){$('notice').textContent=text||'';$('notice').hidden=!text}
function query(){const q=new URLSearchParams({date:$('marketDate').value});if($('asOf').value)q.set('as_of',$('asOf').value);return q}
async function load(refresh=false){if(!$('marketDate').value)return;setLoading(true);message('');try{const q=query();if(refresh)q.set('refresh','1');payload=await api('/api/news/day?'+q);render();await loadImpacts();syncUrl()}catch(e){message(e.message)}finally{setLoading(false)}}
function syncUrl(){const u=new URL(location.href);u.searchParams.set('date',$('marketDate').value);if($('asOf').value)u.searchParams.set('as_of',$('asOf').value);else u.searchParams.delete('as_of');history.replaceState(null,'',u)}
function render(){const asof=payload.as_of?`截至 ${payload.as_of.slice(0,5)}（无剧透）`:'全天复盘';$('scope').textContent=`${payload.market_date} · ${asof} · ${payload.items.length} 条`;$('cache').textContent=payload.fetched_at?`缓存更新 ${payload.fetched_at.replace('T',' ')}`:'尚无缓存';$('source').href=payload.source_url;if(payload.message)message(payload.message);const grouped=Object.fromEntries(phases.map(p=>[p,[]]));payload.items.forEach(x=>(grouped[x.phase]||grouped.close).push(x));$('timeline').innerHTML=phases.map(p=>`<section class="phase phase-${p}"><header class="phase-head"><div><h2>${labels[p]}</h2><small>${phaseHints[p]}</small></div><b>${grouped[p].length}</b></header><div class="news-list">${grouped[p].length?grouped[p].map(newsCard).join(''):'<div class="empty">该时段没有重要资讯</div>'}</div></section>`).join('')}
function newsCard(x){const tags=(x.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('');return`<article class="news"><div class="news-meta"><span class="news-time">${esc(x.time.slice(0,5))}</span>${tags}</div><h3>${esc(x.title)}</h3>${x.digest?`<p>${esc(x.digest)}</p>`:''}<div class="news-actions">${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">查看原文</a>`:''}<button class="impact-btn" data-impact="${esc(x.id)}">记录影响</button></div></article>`}
async function loadImpacts(){const q=new URLSearchParams({date:$('marketDate').value});const code=new URL(location.href).searchParams.get('code');if(code)q.set('code',code);try{const rows=await api('/api/news/impacts?'+q);$('impacts').innerHTML=rows.length?rows.map(impactCard).join(''):'<div class="empty">当天尚未记录任何消息影响</div>'}catch(e){$('impacts').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function impactCard(x){return`<div class="impact"><div class="impact-label"><b>${esc(x.decision_time?.slice(0,5)||'未填时刻')}</b>${esc(x.code||'市场整体')} · ${stanceNames[x.stance]||x.stance}</div><div class="impact-body"><strong>${actionNames[x.action]||x.action}｜${esc(x.news_title)}</strong><p>${esc(x.note)}</p></div><button class="delete" data-delete="${x.id}">删除</button></div>`}
function openImpact(id){const item=payload.items.find(x=>x.id===id);if(!item)return;pickedId=id;$('pickedNews').textContent=`${item.time.slice(0,5)}｜${item.title}`;$('decisionTime').value=$('asOf').value||item.time.slice(0,5);$('impactCode').value=new URL(location.href).searchParams.get('code')||'';$('impactNote').value='';$('impactModal').hidden=false}
function closeImpact(){$('impactModal').hidden=true;pickedId=null}
async function saveImpact(){const body={news_id:pickedId,market_date:$('marketDate').value,decision_time:$('decisionTime').value,code:$('impactCode').value,action:$('impactAction').value,stance:$('impactStance').value,note:$('impactNote').value};try{await api('/api/news/impact','POST',body);closeImpact();await loadImpacts()}catch(e){message(e.message)}}
$('load').onclick=()=>load(false);$('fullDay').onclick=()=>{$('asOf').value='';load(false)};$('refresh').onclick=()=>load(true);$('cancelImpact').onclick=closeImpact;$('backdrop').onclick=closeImpact;$('saveImpact').onclick=saveImpact;
$('timeline').onclick=e=>{const b=e.target.closest('[data-impact]');if(b)openImpact(b.dataset.impact)};$('impacts').onclick=async e=>{const b=e.target.closest('[data-delete]');if(b&&confirm('删除这条消息影响记录？')){try{await api('/api/news/impact/delete','POST',{impact_id:b.dataset.delete});await loadImpacts()}catch(err){message(err.message)}}};
const u=new URL(location.href),today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'});$('marketDate').value=u.searchParams.get('date')||today;$('asOf').value=(u.searchParams.get('as_of')||'').slice(0,5);load(false);
</script>
</body>
</html>
