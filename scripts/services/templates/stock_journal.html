ont-size:12px}.event-button.active{color:#fff;border-color:var(--event-color);background:var(--event-color)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;color:#667186;font-size:11px;font-weight:650;margin:0 0 4px}.field input,.field textarea,.field select{width:100%;border:1px solid #cfd6e2;border-radius:8px;background:#fff;padding:9px 10px;outline:0}.field input:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}.field textarea{min-height:72px;resize:vertical}.reason textarea{min-height:94px}.submit{width:100%;border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:750;padding:11px;margin-top:11px}.submit:disabled{opacity:.45;cursor:not-allowed}.append-note{font-size:10px;color:var(--muted);margin:7px 0 0}.timeline{max-height:490px;overflow:auto}.entry{position:relative;border-left:2px solid var(--event-color);padding:0 0 14px 13px;margin-left:5px}.entry:before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--event-color);box-shadow:0 0 0 3px #fff}.entry-head{display:flex;justify-content:space-between;gap:10px}.entry-head b{color:var(--event-color)}.entry-head span{font-size:10px;color:var(--muted)}.entry-reason{margin-top:4px;white-space:pre-wrap}.entry-details{margin-top:5px;color:#5f6b7e;font-size:11px;background:#f6f8fb;border-radius:6px;padding:6px 8px}.tag{display:inline-block;background:#eef1f6;color:#627087;border-radius:5px;padding:1px 6px;margin:4px 4px 0 0;font-size:10px}.timeline-meta{display:flex;align-items:center;gap:7px}.entry-delete{border:0;background:transparent;color:#9a6370;font-size:10px;padding:1px 3px}.entry-delete:hover{color:#b42338;text-decoration:underline}.trash{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}.trash.open{display:block}.trash-item{padding:9px 10px;margin-bottom:7px;borde .minute-panel .intraday-replay{padding:7px 12px}.synced{animation:sync-field .9s ease-out}@keyframes sync-field{0%{box-shadow:0 0 0 4px rgba(37,99,235,.28);border-color:var(--blue)}100%{box-shadow:none}}

<body>
<div id="app-shell" data-active="journal"></div>
<div class="loading" id="loading"><span>正在读取本地行情与日记…</span></div><div class="notice" id="notice"></div>
<main class="page">
  <header class="topbar">
    <div class="brand">📓 选股日记<small>STOCK RESEARCH WORKSPACE</small></div>
    <div class="search-wrap"><div class="search-box"><input id="symbolSearch" autocomplete="off" data-clear-on-focus="1" placeholder="输入股票名称或代码"><button id="searchButton">查看</button></div><div class="results" id="searchResults"></div></div>
    <div class="top-actions"><a class="ghost" id="symbolContextLink" href="/symbol.html" style="text-decoration:none">标的上下文</a><button class="ghost" id="backupButton">备份日记</button><a class="ghost" href="/index.html" style="text-decoration:none">返回首页</a></div>
  </header>
  <section class="layout">
    <div class="card market-card">
      <div class="market-head"><div class="identity"><h1 id="symbolName">—</h1><span id="symbolCode">—</span></div><div class="quote"><strong id="latestPrice">—</strong><span id="latestChange">—</span></div><div class="market-stats"><div class="market-stat"><span class="label">今开</span><span class="value" id="statOpen">—</span></div><div class="market-stat"><span class="label">最高</span><span class="value" id="statHigh">—</span></div><div class="market-stat"><span class="label">最低</span><span class="value" id="statLow">—</span></div><div class="market-stat"><span class="label">成交额</span><span class="value" id="statAmount">—</span></div><div class="market-stat"><span class="label">换手率</span><span class="value" id="statTurnover">—</span></div></div></div>
      <div class="chart-toolbar"><span class="muted">显示范围</span><button data-days="120">120日</button><button data-days="250" class="active">250日</button><button data-days="500">500日</button></div>
      <div id="dailyChart"></div><div class="chart-hint"><span>点击某根蜡烛：同步日记日期/价格，并在下方展开对应分时</span><span>●观望　◆计划　▲买入　■持有　▼卖出　×失效</span></div>
      <section class="minute-panel" id="minutePanel" hidden><div class="minute-head"><div><b id="minuteTitle">当日分时</b><span id="minuteMeta">—</span></div><div class="minute-actions"><a id="minuteFullLink" href="/minute_view.html" hidden>完整分时页</a><button id="closeMinute" type="button" onclick="closeMinutePanel()">收起</button></div></div><div class="intraday-replay" aria-label="日记动态分时回放"><button class="replay-primary" id="minuteReplayPlay">▶ 动态分时</button><button id="minuteReplayStep">推进1分钟</button><button id="minuteReplayReset">回到开盘</button><select id="minuteReplaySpeed" aria-label="日记动态分时速度"><option value="1">1×</option><option value="2">2×</option><option value="5" selected>5×</option><option value="10">10×</option></select><button id="minuteReplayAll">查看全日</button><span class="replay-clock" id="minuteReplayClock">全日</span><span class="replay-progress" id="minuteReplayProgress">—</span></div><div class="minute-empty" id="minuteEmpty" hidden></div><div id="minuteChart"></div></section>
    </div>
    <aside class="side">
      <section class="card side-card"><div class="section-head"><h2>研究案例</h2><button class="small-button" id="newCaseButton">＋新案例</button></div>
        <div class="new-case" id="newCasePanel"><div class="field"><label>案例标题</label><input id="caseTitle" maxlength="120" placeholder="例如：平台缩量后等待放量突破"></div><div class="field" style="margin-top:7px"><label>核心逻辑</label><textarea id="caseThesis" maxlength="2000" placeholder="这次观察要验证什么？"></textarea></div><div class="field" style="margin-top:7px"><label>标签</label><input id="caseTags" placeholder="白酒, 趋势, 等待突破"></div><div class="actions"><button id="cancelCase">取消</button><button class="primary" id="createCase">创建案例</button></div></div>
        <div class="case-list" id="caseList"><div class="empty">暂无研究案例</div></div>
      </section>
      <section class="card side-card"><div class="section-head"><h2>快速记录</h2><span class="muted" id="selectedCaseLabel">请先选择案例</span></div>
        <div class="event-buttons" id="eventButtons"></div>
        <div class="form-grid">
          <div class="field"><label>行情日期</label><input id="marketDate" type="date"></div><div class="field"><label>当时价格</label><input id="entryPrice" type="number" min="0" step="0.001"></div>
          <div class="field full reason"><label id="reasonLabel">决策原因</label><textarea id="reason" maxlength="4000" placeholder="只写当时能看到的证据，以及为什么现在采取这个动作"></textarea></div>
          <div class="field full"><label>触发条件 / 等待条件</label><textarea id="triggerCondition" maxlength="1000" placeholder="例如：收盘站稳20日线且成交额高于20日均值"></textarea></div>
          <div class="field full"><label>失效条件 / 不再持有条件</label><textarea id="invalidationCondition" maxlength="1000" placeholder="例如：放量跌破平台下沿"></textarea></div>
          <div class="field"><label>目标价格</label><input id="targetPrice" type="number" min="0" step="0.001"></div><div class="field"><label>止损价格</label><input id="stopPrice" type="number" min="0" step="0.001"></div>
          <div class="field"><label>计划仓位%</label><input id="positionPct" type="number" min="0" max="100" step="1"></div><div class="field"><label>计划持有天数</label><input id="holdingDays" type="number" min="1" max="3650"></div>
          <div class="field"><label>下次复查日期</label><input id="reviewDate" type="date"></div><div class="field"><label>标签</label><input id="entryTags" placeholder="量价, 支撑, 纪律"></div>
        </div><button class="submit" id="saveEntry" disabled>追加到日记</button><p class="append-note">记录采用追加模式；后续改变看法请再写一条，不会覆盖当时判断。</p>
      </section>
      <section class="card side-card timeline-card"><div class="section-head"><h2>案例时间线</h2><div class="timeline-meta"><span class="muted" id="entryCount">0条</span><button class="small-button" id="trashToggle" onclick="document.getElementById('trash').classList.toggle('open')">回收站 0</button></div></div><div class="timeline" id="timeline"><div class="empty">选择案例后查看完整决策轨迹</div></div><div class="trash" id="trash"><div class="empty">回收站为空</div></div></section>
    </aside>
  </section>
  <section class="card journal-center"><div class="section-head"><h2>日记中心</h2><span class="muted">按状态和全文快速查找</span></div><div id="dueReviews"></div><div class="center-filters"><input id="centerQuery" placeholder="搜索代码、标题、原因或标签"><select id="centerStatus"><option value="">全部状态</option><option value="watching">观察中</option><option value="planned">等待进场</option><option value="holding">持有中</option><option value="exit_planned">等待离场</option><option value="closed">已结束</option><option value="invalidated">逻辑失效</option></select><button class="ghost" id="centerSearch">查询</button></div><div id="centerTable"></div></section>
</main>
<script src="/assets/chart-touch.js"></script>
<script src="vendor/echarts.min.js"></script><script>window.echarts||document.write(`<script src='https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js'><\/script>`);</script>
<script>__INTRADAY_REPLAY_JS__</script>
<script>
const $=id=>document.getElementById(id),chart=echarts.init($('dailyChart'));let dailyTouchCtrl=null,minuteTouchCtrl=null,minuteChart=null,minuteData=null,minuteRequestToken=0,market=null,cases=[],entries=[],deletedEntries=[],selectedCaseId=null,currentDays=250,searchTimer=null,initialMinuteDate=new URL(location.href).searchParams.get('date');const journalMinuteReplay=createIntradayReplay({onFrame:renderMinuteReplayFrame,initialSpeed:5});
const EVENT={watch:{label:'观望',color:'#7b8494',symbol:'circle',reason:'观望原因'},entry_plan:{label:'计划买入',color:'#2563eb',symbol:'diamond',reason:'进场计划与原因'},entry:{label:'实际买入',color:'#df3f4b',symbol:'triangle',reason:'实际进场原因'},hold:{label:'继续持有',color:'#c47b0c',symbol:'rect',reason:'继续持有原因'},exit_plan:{label:'计划卖出',color:'#7656d6',symbol:'diamond',reason:'离场计划与原因'},exit:{label:'实际卖出',color:'#159467',symbol:'triangle',rotate:180,reason:'实际离场原因'},invalidated:{label:'逻辑失效',color:'#303745',symbol:'path://M-7,-7L7,7M7,-7L-7,7',reason:'逻辑失效或放弃原因'},review:{label:'复盘',color:'#1687a7',symbol:'roundRect',reason:'复盘结论'}};
const STATUS={watching:'观察中',planned:'等待进场',holding:'持有中',exit_planned:'等待离场',closed:'已结束',invalidated:'逻辑失效'};
let eventType='watch';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function price(v){if(v===null||v===undefined||!Number.isFinite(+v))return'—';return(+v)<10?(+v).toFixed(3):(+v).toFixed(2)}function compact(v){const n=+v||0;if(n>=1e8)return(n/1e8).toFixed(2)+'亿';if(n>=1e4)return(n/1e4).toFixed(1)+'万';return Math.round(n).toLocaleString()}function tone(v){if(v===null||v===undefined||v==='')return'flat';return+v>0?'up':+v<0?'down':'flat'}function signed(v){if(v===null||v===undefined||v===''||!Number.isFinite(+v))return'—';return`${+v>=0?'+':''}${(+v).toFixed(2)}%`}
function notice(message,error=false){if(window.StockAppShell&&StockAppShell.toast){const n=$('notice');if(n)n.style.display='none';if(message)StockAppShell.toast(message,{tone:error?'error':'ok'});return}const n=$('notice');n.textContent=message;n.style.background=error?'#9f2733':'#172033';n.style.display='block';clearTimeout(n._timer);n._timer=setTimeout(()=>n.style.display='none',4200)}function loading(on){$('loading').style.display=on?'grid':'none'}
async function request(path,method='GET',body=null){const options={method,cache:'no-store',headers:{}};if(body){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body)}const response=await fetch(path,options);let result={};try{result=await response.json()}catch(e){}if(!response.ok)throw new Error(result.error||`HTTP ${response.status}`);return result}
function renderEventButtons(){ $('eventButtons').innerHTML=Object.entries(EVENT).map(([key,x])=>`<button class="event-button ${key===eventType?'active':''}" style="--event-color:${x.color}" data-event="${key}">${x.label}</button>`).join('');$('reasonLabel').textContent=EVENT[eventType].reason;$('eventButtons').querySelectorAll('button').forEach(b=>b.onclick=()=>{eventType=b.dataset.event;renderEventButtons()})}
async function loadSymbol(code,selectCase=null){loading(true);try{const normalized=code.trim();const [k,c,allEntries]=await Promise.all([request(`/api/journal/kline?code=${encodeURIComponent(normalized)}&days=${currentDays}`),request(`/api/journal/cases?code=${encodeURIComponent(normalized)}`),request(`/api/journal/entries?include_deleted=1&code=${encodeURIComponent(normalized)}`)]);if(market)closeMinutePanel();market=k;cases=c;entries=allEntries.filter(x=>!x.deleted_at);deletedEntries=allEntries.filter(x=>x.deleted_at);selectedCaseId=selectCase&&cases.some(x=>x.id===+selectCase)?+selectCase:(cases[0]?.id??null);renderAll();const u=new URL(location.href);u.searchParams.set('code',market.code);if(selectedCaseId)u.searchParams.set('case',selectedCaseId);else u.searchParams.delete('case');history.replaceState(null,'',u);const sc=$('symbolContextLink');if(sc)sc.href='/symbol.html?code='+encodeURIComponent(market.code)}catch(e){notice(e.message,true)}finally{loading(false)}}

setMinuteReplayAvailable(false);$('minuteReplayPlay').onclick=()=>journalMinuteReplay.toggle();$('minuteReplayStep').onclick=()=>journalMinuteReplay.step();$('minuteReplayReset').onclick=()=>journalMinuteReplay.reset();$('minuteReplayAll').onclick=()=>journalMinuteReplay.showAll();$('minuteReplaySpeed').onchange=e=>journalMinuteReplay.setSpeed(e.target.value);
renderEventButtons();$('searchButton').onclick=doSearch;$('symbolSearch').onkeydown=e=>{if(e.key==='Enter')doSearch()};$('symbolSearch').oninput=()=>{clearTimeout(searchTimer);const q=$('symbolSearch').value.trim();if(q.length<2){$('searchResults').style.display='none';return}searchTimer=setTimeout(async()=>{try{showResults(await request('/api/journal/search?q='+encodeURIComponent(q)))}catch(e){}},220)};$('searchResults').onclick=e=>{const r=e.target.closest('[data-code]');if(r){$('searchResults').style.display='none';loadSymbol(r.dataset.code)}};document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))$('searchResults').style.display='none'});$('newCaseButton').onclick=()=>$('newCasePanel').classList.toggle('open');$('cancelCase').onclick=()=>$('newCasePanel').classList.remove('open');$('createCase').onclick=createCase;$('saveEntry').onclick=saveEntry;$('centerSearch').onclick=loadCenter;$('centerQuery').onkeydown=e=>{if(e.key==='Enter')loadCenter()};$('backupButton').onclick=async()=>{try{const x=await request('/api/journal/backup','POST',{});notice('备份完成：'+x.path)}catch(e){notice(e.message,true)}};document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{currentDays=+b.dataset.days;document.querySelectorAll('[data-days]').forEach(x=>x.classList.toggle('active',x===b));loadSymbol(market.code,selectedCaseId)});window.onresize=()=>{chart.resize();if(minuteChart&&!$('minutePanel').hidden)minuteChart.resize()};const url=new URL(location.href);loadSymbol(url.searchParams.get('code')||'sh600519',url.searchParams.get('case'));loadCenter();
</script>
