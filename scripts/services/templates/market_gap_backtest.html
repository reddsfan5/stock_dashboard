<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>指数跳空三日回测</title>
  <link rel="stylesheet" href="/assets/app.css">
  <style>
    :root{--low:#159568;--high:#e5484d}
    .page{max-width:1440px;margin:0 auto;padding:18px 22px 44px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:14px}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--app-accent);font-weight:750}.hero h1{font-size:25px;margin:4px 0 4px}.hero p{margin:0;color:var(--app-muted);max-width:760px}.method-link{white-space:nowrap;margin-top:8px}
    .panel{background:var(--app-surface);border:1px solid var(--app-border);border-radius:12px;box-shadow:var(--app-shadow)}.controls{display:grid;grid-template-columns:1.35fr repeat(4,minmax(125px,1fr)) auto;gap:10px;padding:14px;align-items:end}.field{display:grid;gap:5px}.field label{font-size:11px;color:var(--app-muted);font-weight:650}.field input,.field select{height:38px;font-weight:650;font-variant-numeric:tabular-nums}.run{height:38px;min-width:112px}.notice{margin:10px 14px 0;padding:9px 11px;border-radius:8px;background:#fff7dc;color:#7a5b00;font-size:12px;display:none}.notice.error{display:block;background:#fff0f0;color:#a82b32}.notice.info{display:block}
    .summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.summary-card{padding:16px 17px;position:relative;overflow:hidden}.summary-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}.summary-card.low:before{background:var(--low)}.summary-card.high:before{background:var(--high)}.summary-card.base:before{background:var(--app-accent)}.summary-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.summary-head .label{color:var(--app-muted);font-size:12px}.summary-head .samples{font-size:11px;color:var(--app-muted);background:var(--app-surface-2);padding:3px 7px;border-radius:99px}.primary-value{font-size:30px;font-weight:750;margin-top:4px;font-variant-numeric:tabular-nums}.primary-value.up{color:var(--high)}.primary-value.down{color:var(--low)}.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--app-border)}.metric .label{display:block;color:var(--app-muted);font-size:10px}.metric .value{display:block;font-size:14px;font-weight:680;font-variant-numeric:tabular-nums;margin-top:2px}.card-note{font-size:11px;color:var(--app-muted);margin-top:10px;line-height:1.5}
    .grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,.65fr);gap:10px;margin-top:10px}.section{padding:15px 16px;min-width:0}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}.section h2{font-size:15px;margin:0}.section-head span{font-size:11px;color:var(--app-muted)}#pathChart{height:330px}.table-wrap{overflow:auto;max-height:350px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:9px 10px;border-bottom:1px solid var(--app-border);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}th{position:sticky;top:0;background:var(--app-surface-2);z-index:1;color:var(--app-muted);font-size:10px}th:first-child,td:first-child{text-align:left}.dir-low{color:var(--low);font-weight:700}.dir-high{color:var(--high);font-weight:700}.pos{color:var(--high)}.neg{color:var(--low)}
    .tabs{display:flex;gap:5px;margin:12px 0 8px}.tab{border:1px solid var(--app-border);background:var(--app-surface);color:var(--app-muted);border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer}.tab.active{background:var(--app-accent);border-color:var(--app-accent);color:#fff}.events{margin-top:10px}.event-tools{display:flex;align-items:center;gap:8px}.event-tools select{height:32px}.truth{display:flex;gap:7px;align-items:flex-start;padding:11px 12px;margin-top:10px;background:var(--app-surface-2);border-radius:8px;color:var(--app-muted);font-size:12px}.truth b{color:var(--app-text)}.loading{opacity:.55;pointer-events:none}
    @media(max-width:1000px){.controls{grid-template-columns:repeat(3,1fr)}.controls .field:first-child{grid-column:span 2}.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.summary-card.base{grid-column:1/-1}}
    @media(max-width:640px){.page{padding:12px 10px 34px}.hero{display:block}.hero h1{font-size:21px}.method-link{display:inline-flex}.controls{grid-template-columns:1fr 1fr;padding:11px}.controls .field:first-child{grid-column:1/-1}.run{grid-column:1/-1}.summary{grid-template-columns:1fr}.summary-card.base{grid-column:auto}.primary-value{font-size:26px}.metric-grid{grid-template-columns:repeat(3,1fr)}.grid{display:block}.section{margin-top:10px;padding:13px 12px}#pathChart{height:285px}.table-wrap{max-height:420px}.event-tools{width:100%;justify-content:space-between}.section-head{flex-wrap:wrap}}
  </style>
</head>
<body>
<div id="app-shell" data-active="backtest"></div>
<main class="page">
  <header class="hero">
    <div><div class="eyebrow">EVENT STUDY · MARKET OPEN GAP</div><h1>指数高低开后的三日路径</h1><p>用信号日开盘价作为可执行起点，观察到第 N 个交易日收盘。重点看条件收益相对全样本基线，而不是只看胜率。</p></div>
    <a class="btn method-link" href="/stats_report.html">返回策略总览</a>
  </header>
  <section class="panel controls" id="controls">
    <div class="field"><label for="indexCode">大盘指数</label><select id="indexCode"><option value="sh000001">上证指数 · sh000001</option><option value="sh000300">沪深300 · sh000300</option><option value="sz399001">深证成指 · sz399001</option><option value="sz399006">创业板指 · sz399006</option><option value="sh000688">科创50 · sh000688</option></select></div>
    <div class="field"><label for="startDate">起始日期</label><input id="startDate" type="date" value="2020-01-01"></div>
    <div class="field"><label for="endDate">结束日期（留空=最新）</label><input id="endDate" type="date"></div>
    <div class="field"><label for="threshold">高低开阈值（%）</label><input id="threshold" type="number" value="0.7" min="0.1" max="10" step="0.1"></div>
    <div class="field"><label for="horizon">退出日（信号日=第1日）</label><select id="horizon"><option value="2">第2日收盘</option><option value="3" selected>第3日收盘</option><option value="5">第5日收盘</option><option value="10">第10日收盘</option></select></div>
    <button class="btn btn-primary run" id="run">重新计算</button>
  </section>
  <div class="notice" id="notice"></div>
  <section class="summary" id="summary"></section>
  <div class="grid">
    <section class="panel section"><div class="section-head"><h2>持有路径</h2><span>相对信号日开盘 · 红涨绿跌</span></div><div id="pathChart"></div><div class="truth" id="comparison"></div></section>
    <section class="panel section"><div class="section-head"><h2>缺口强度分层</h2><span>检查优势是否只来自少数极端样本</span></div><div class="table-wrap"><table><thead><tr><th>方向 / 幅度</th><th>样本</th><th>均值</th><th>中位</th><th>胜率</th></tr></thead><tbody id="severity"></tbody></table></div></section>
  </div>
  <section class="panel section events"><div class="section-head"><div><h2>年度稳定性与事件明细</h2><span id="range"></span></div><div class="event-tools"><button class="tab active" data-view="yearly">年度</button><button class="tab" data-view="events">事件</button><select id="direction"><option value="all">全部方向</option><option value="low">仅低开</option><option value="high">仅高开</option></select></div></div><div class="table-wrap"><table><thead id="detailHead"></thead><tbody id="detailBody"></tbody></table></div></section>
  <div class="truth"><span>口径：</span><span id="method">正在加载……</span></div>
</main>
<script src="/vendor/echarts.min.js"></script>
<script src="/assets/app-shell.js"></script>
<script>
const $=id=>document.getElementById(id);let result=null,currentView='yearly';const pct=v=>v==null?'—':`${v>=0?'+':''}${Number(v).toFixed(2)}%`;const plainPct=v=>v==null?'—':`${Number(v).toFixed(1)}%`;const num=v=>v==null?'—':Number(v).toLocaleString('zh-CN');const cls=v=>v>0?'pos':v<0?'neg':'';const dir=d=>d==='low'?'低开':'高开';
function metric(label,value,tone=''){return `<div class="metric"><span class="label">${label}</span><span class="value ${tone}">${value}</span></div>`}
function summaryCard(key,title,s){if(key==='base')return `<article class="panel summary-card base"><div class="summary-head"><span class="label">全样本基线</span><span class="samples">${num(s.samples)} 个交易日</span></div><div class="primary-value ${cls(s.mean_return_pct)}">${pct(s.mean_return_pct)}</div><div class="metric-grid">${metric('中位收益',pct(s.median_return_pct),cls(s.median_return_pct))}${metric('上涨概率',plainPct(s.win_rate_pct))}</div><div class="card-note">同一日期范围、同一退出规则下所有可计算交易日的结果，用来判断缺口条件是否真正增加优势。</div></article>`;const isLow=key==='low';return `<article class="panel summary-card ${key}"><div class="summary-head"><span class="label">${title}</span><span class="samples">${num(s.samples)} 次</span></div><div class="primary-value ${cls(s.mean_return_pct)}">${pct(s.mean_return_pct)}</div><div class="metric-grid">${metric('中位收益',pct(s.median_return_pct),cls(s.median_return_pct))}${metric('上涨概率',plainPct(s.win_rate_pct))}${metric('平均最大浮盈',pct(s.mfe_pct),'pos')}${metric('平均最大浮亏',pct(s.mae_pct),'neg')}${metric(isLow?'三日向上回补':'三日向下回补',plainPct(s.gap_fill_rate_pct))}${metric(isLow?'收回前收':'仍高于前收',plainPct(s.close_recovery_rate_pct))}</div></article>`}
function renderSummary(){const s=result.summary;$('summary').innerHTML=summaryCard('low',`低开 ≥ ${result.config.threshold_pct}%`,s.low)+summaryCard('high',`高开 ≥ ${result.config.threshold_pct}%`,s.high)+summaryCard('base','基线',s.baseline);const lowEdge=s.low.mean_return_pct-s.baseline.mean_return_pct,highEdge=s.high.mean_return_pct-s.baseline.mean_return_pct;$('comparison').innerHTML=`<span>判断：</span><span>低开条件相对基线 <b class="${cls(lowEdge)}">${pct(lowEdge)}</b>；高开条件相对基线 <b class="${cls(highEdge)}">${pct(highEdge)}</b>。非重叠样本均值：低开 <b class="${cls(result.non_overlapping.low.mean_return_pct)}">${pct(result.non_overlapping.low.mean_return_pct)}</b>，高开 <b class="${cls(result.non_overlapping.high.mean_return_pct)}">${pct(result.non_overlapping.high.mean_return_pct)}</b>。</span>`}
function renderChart(){const labels=[...new Set(result.paths.map(x=>x.label))],pick=d=>labels.map(label=>{const r=result.paths.find(x=>x.direction===d&&x.label===label);return r?r.mean_return_pct:null});const chart=echarts.init($('pathChart'));chart.setOption({animationDuration:280,tooltip:{trigger:'axis',valueFormatter:v=>pct(v)},legend:{bottom:0,data:['低开后','高开后']},grid:{left:48,right:20,top:24,bottom:50},xAxis:{type:'category',data:labels,boundaryGap:false},yAxis:{type:'value',axisLabel:{formatter:v=>`${v>0?'+':''}${v.toFixed(1)}%`},splitLine:{lineStyle:{type:'dashed'}}},series:[{name:'低开后',type:'line',data:pick('low'),symbolSize:7,lineStyle:{width:2,color:'#159568'},itemStyle:{color:'#159568'}},{name:'高开后',type:'line',data:pick('high'),symbolSize:7,lineStyle:{width:2,color:'#e5484d'},itemStyle:{color:'#e5484d'}}]});window.addEventListener('resize',()=>chart.resize(),{passive:true})}
function renderSeverity(){ $('severity').innerHTML=result.severity.map(r=>`<tr><td><span class="dir-${r.direction}">${dir(r.direction)}</span> · ${r.bucket}</td><td>${num(r.samples)}</td><td class="${cls(r.mean_return_pct)}">${pct(r.mean_return_pct)}</td><td class="${cls(r.median_return_pct)}">${pct(r.median_return_pct)}</td><td>${plainPct(r.win_rate_pct)}</td></tr>`).join('')}
function rowsForView(){const filter=$('direction').value;if(currentView==='yearly')return result.yearly.filter(r=>filter==='all'||r.direction===filter);return result.events.filter(r=>filter==='all'||r.direction===filter)}
function renderDetails(){const rows=rowsForView();if(currentView==='yearly'){$('detailHead').innerHTML='<tr><th>年份 / 方向</th><th>样本</th><th>平均收益</th><th>中位收益</th><th>胜率</th><th>缺口回补</th></tr>';$('detailBody').innerHTML=rows.map(r=>`<tr><td>${r.year} · <span class="dir-${r.direction}">${dir(r.direction)}</span></td><td>${num(r.samples)}</td><td class="${cls(r.mean_return_pct)}">${pct(r.mean_return_pct)}</td><td class="${cls(r.median_return_pct)}">${pct(r.median_return_pct)}</td><td>${plainPct(r.win_rate_pct)}</td><td>${plainPct(r.gap_fill_rate_pct)}</td></tr>`).join('')}else{$('detailHead').innerHTML='<tr><th>信号日 / 方向</th><th>开盘缺口</th><th>退出日</th><th>窗口收益</th><th>最大浮盈</th><th>最大浮亏</th><th>回补</th></tr>';$('detailBody').innerHTML=rows.map(r=>`<tr><td>${r.date} · <span class="dir-${r.direction}">${dir(r.direction)}</span></td><td class="${cls(r.gap_pct)}">${pct(r.gap_pct)}</td><td>${r.target_date}</td><td class="${cls(r.return_pct)}">${pct(r.return_pct)}</td><td class="pos">${pct(r.mfe_pct)}</td><td class="neg">${pct(r.mae_pct)}</td><td>${r.gap_filled?'是':'否'}</td></tr>`).join('')}if(!rows.length)$('detailBody').innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--app-muted)">当前筛选没有事件</td></tr>'}
function render(){renderSummary();renderChart();renderSeverity();renderDetails();$('range').textContent=`${result.range.start} 至 ${result.range.end} · ${num(result.range.rows)} 根日K`;$('method').textContent=`${result.methodology.gap}；${result.methodology.entry}买入，${result.methodology.exit}退出。${result.methodology.costs}。数据来源：${Object.entries(result.quality.sources).map(([k,v])=>`${k} ${v}根`).join('、')}。`}
async function run(){const q=new URLSearchParams({code:$('indexCode').value,start:$('startDate').value,threshold:$('threshold').value,horizon:$('horizon').value});if($('endDate').value)q.set('end',$('endDate').value);$('controls').classList.add('loading');$('run').textContent='计算中…';$('notice').className='notice';try{const r=await fetch('/api/backtest/market-gap?'+q,{cache:'no-store'}),body=await r.json();if(!r.ok)throw new Error(body.error||`HTTP ${r.status}`);result=body;render()}catch(e){$('notice').textContent=e.message;$('notice').className='notice error'}finally{$('controls').classList.remove('loading');$('run').textContent='重新计算'}}
$('run').onclick=run;$('direction').onchange=renderDetails;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentView=b.dataset.view;renderDetails()});run();
</script>
</body></html>
